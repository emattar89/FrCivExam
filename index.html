<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101B4C">
<title>Examen civique — cours et entraînement</title>
<style>
:root{--encre:#101B4C;--encre-clair:#2C3A75;--papier:#FBFAF7;--papier-ombre:#EFEDE6;
  --trait:#D8D4C8;--sceau:#8C1D2C;--vert:#1F6B4A;--gris:#6B6A63}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--papier);color:var(--encre);
  font:400 17px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2.5px solid var(--sceau);outline-offset:2px}
header{border-bottom:1px solid var(--trait);padding:10px 16px;display:flex;align-items:center;
  gap:12px;flex:0 0 auto;background:var(--papier)}
.marque{font-weight:700;font-size:15px;letter-spacing:-.01em}
.marque span{color:var(--gris);font-weight:400}
.compteur{margin-left:auto;font-variant-numeric:tabular-nums;font-size:14px;color:var(--gris)}
.chrono{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.chrono.urgent{color:var(--sceau)}
.lien{font-size:14px;color:var(--encre-clair);text-decoration:underline;text-underline-offset:3px}
.jauge{height:3px;background:var(--papier-ombre);flex:0 0 auto}
.jauge i{display:block;height:100%;background:var(--encre);transition:width .35s ease}
main{flex:1 1 auto;overflow-y:auto;display:flex;flex-direction:column;align-items:center;
  padding:28px 20px 20px;-webkit-overflow-scrolling:touch}
main.centre{justify-content:center}
.ecran,.scene{width:100%;max-width:34rem}
h1{font-family:Georgia,serif;font-size:clamp(26px,6vw,34px);line-height:1.15;margin:0 0 10px;
  font-weight:400;letter-spacing:-.015em}
.chapo{color:var(--gris);margin:0 0 26px;font-size:15.5px;line-height:1.55}
.theme{font-size:13px;color:var(--gris);margin-bottom:22px;display:flex;gap:8px;
  align-items:baseline;flex-wrap:wrap}
.pastille{border:1px solid var(--trait);border-radius:2px;padding:1px 6px;font-size:11px;
  font-weight:600;color:var(--encre-clair)}
.question{font-family:Georgia,"Iowan Old Style",serif;font-size:clamp(21px,4.6vw,27px);
  line-height:1.34;margin:0 0 26px;letter-spacing:-.005em}
.reponse{border-left:3px solid var(--sceau);padding:2px 0 2px 16px;margin:0 0 26px;
  font-size:16.5px;line-height:1.55}
.reponse b{display:block;font-size:12px;font-weight:700;color:var(--sceau);margin-bottom:6px}
.commandes{position:sticky;bottom:0;background:var(--papier);border-top:1px solid var(--trait);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));flex:0 0 auto}
.rangee{display:flex;gap:10px;max-width:34rem;margin:0 auto}
.btn{flex:1;padding:15px 12px;border-radius:3px;font-weight:600;font-size:16px;
  border:1.5px solid var(--encre);background:var(--encre);color:var(--papier);
  transition:transform .08s ease}
.btn:active{transform:translateY(1px)}
.btn.creux{background:none;color:var(--encre)}
.btn.su{border-color:var(--vert);background:var(--vert);color:#fff}
.btn.revoir{border-color:var(--sceau);color:var(--sceau);background:none}
.btn.mini{flex:0 0 auto;padding:15px 18px}
fieldset{border:none;padding:0;margin:0 0 20px}
legend{font-size:13px;color:var(--gris);margin-bottom:8px;padding:0}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.puce{border:1.5px solid var(--trait);border-radius:3px;padding:9px 13px;font-size:14.5px;
  background:none;color:var(--encre-clair);text-align:left}
.puce[aria-pressed=true]{border-color:var(--encre);background:var(--encre);color:var(--papier)}
.puce small{display:block;font-size:11px;opacity:.7;margin-top:2px}
.stat{display:flex;gap:20px;margin:0 0 24px;padding:16px 0;border-top:1px solid var(--trait);
  border-bottom:1px solid var(--trait)}
.stat div{flex:1}
.stat b{display:block;font-size:27px;font-family:Georgia,serif;font-weight:400;
  font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12.5px;color:var(--gris)}
.score{font-family:Georgia,serif;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.score em{font-style:normal;font-size:26px;color:var(--gris)}
.note{font-size:13.5px;color:var(--gris);line-height:1.55;margin-top:26px;padding-top:16px;
  border-top:1px solid var(--trait)}
.note a{color:var(--encre-clair)}
textarea{width:100%;min-height:150px;font:13px/1.4 ui-monospace,Menlo,monospace;padding:11px;
  border:1.5px solid var(--trait);border-radius:3px;background:#fff;color:var(--encre)}
.msg{font-size:14px;margin-top:12px;padding:10px 12px;border-radius:3px}
.msg.ok{background:#E8F1EC;color:var(--vert)}
.msg.ko{background:#F6E9EB;color:var(--sceau)}
.chap{display:block;width:100%;text-align:left;border:none;border-top:1px solid var(--trait);
  padding:15px 0;color:var(--encre)}
.chap:last-of-type{border-bottom:1px solid var(--trait)}
.chap b{display:block;font-family:Georgia,serif;font-size:19px;font-weight:400;line-height:1.25}
.chap span{display:block;font-size:13px;color:var(--gris);margin-top:4px}
.chap i{font-style:normal;color:var(--sceau)}
.cours{width:100%;max-width:36rem}
.cours h2{font-family:Georgia,serif;font-size:clamp(24px,5.4vw,30px);font-weight:400;
  line-height:1.18;margin:0 0 6px;letter-spacing:-.015em}
.cours .meta{font-size:13px;color:var(--gris);margin:0 0 4px}
.cours .intro{font-size:15px;color:var(--gris);line-height:1.55;margin:0 0 8px;
  padding-bottom:18px;border-bottom:1px solid var(--trait)}
.cours h3{font-size:12.5px;font-weight:700;color:var(--sceau);margin:30px 0 10px;
  padding-bottom:5px;border-bottom:1px solid var(--trait)}
.cours h4{font-size:16px;font-weight:700;margin:22px 0 6px}
.cours p{font-size:16px;line-height:1.62;margin:0 0 13px}
.cours ul{margin:0 0 13px;padding-left:20px}
.cours li{font-size:16px;line-height:1.6;margin-bottom:7px}
.tblwrap{overflow-x:auto;margin:0 0 16px;-webkit-overflow-scrolling:touch}
.cours table{border-collapse:collapse;width:100%;font-size:14px;min-width:22rem}
.cours th{background:var(--encre);color:var(--papier);text-align:left;font-weight:600;
  padding:8px 10px;font-size:13px;vertical-align:top}
.cours td{padding:8px 10px;border-bottom:1px solid var(--trait);line-height:1.45;vertical-align:top}
.cours tr:nth-child(even) td{background:var(--papier-ombre)}
.cours td:first-child{font-weight:600}
.cadre{border:1.5px solid var(--sceau);border-radius:3px;background:#fff;padding:14px 16px;margin:22px 0}
.cadre p{font-size:13px;font-weight:700;color:var(--sceau);margin:0 0 8px}
.cadre ul{margin:0;padding-left:18px}
.cadre li{font-size:15px;line-height:1.5;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="marque">Examen civique <span id="sousTitre">naturalisation</span></div>
  <div class="compteur" id="compteur"></div>
  <div class="chrono" id="chrono" hidden></div>
  <button class="lien" id="btnQuitter" hidden>Arrêter</button>
</header>
<div class="jauge"><i id="jauge" style="width:0"></i></div>
<main id="main"></main>
<div class="commandes" id="commandes" hidden><div class="rangee" id="rangee"></div></div>

<script>
const DONNEES = {"themes":["Principes et valeurs de la République","Système institutionnel et politique","Droits et devoirs","Histoire, géographie et culture","Vivre dans la société française"],"quotas":{"Principes et valeurs de la République":5,"Système institutionnel et politique":6,"Droits et devoirs":5,"Histoire, géographie et culture":8,"Vivre dans la société française":4},"bank":[{"i":1,"t":"Principes et valeurs de la République","m":"NAT","q":"Complétez les paroles de la Marseillaise \"Allons enfants de la patrie...\"","a":"« Le jour de gloire est arrivé »."},{"i":2,"t":"Principes et valeurs de la République","m":"NAT","q":"Dans le cadre d'un entretien d'embauche, que peut-on demander au candidat ?","a":"Uniquement des informations ayant un lien direct et nécessaire avec le poste et les compétences. Sont interdites les questions sur l'origine, la religion, les opinions, la situation familiale, la grossesse ou l'orientation sexuelle."},{"i":3,"t":"Principes et valeurs de la République","m":"NAT","q":"Déclarer ses revenus aux services fiscaux est :","a":"Obligatoire, pour toute personne qui réside fiscalement en France, quelle que soit sa nationalité et même sans impôt à payer."},{"i":4,"t":"Principes et valeurs de la République","m":"NAT","q":"En France, les impôts permettent de financer les dépenses publiques. Quelle proposition est correcte ?","a":"Ils financent les services publics dont bénéficie tout le monde : écoles, hôpitaux, routes, police, justice. Les payer est un acte de solidarité et une obligation."},{"i":5,"t":"Principes et valeurs de la République","m":"NAT","q":"La liberté d'association est :","a":"Un droit garanti par la loi de 1901 : chacun peut créer une association ou y adhérer librement, sans autorisation préalable, et nul ne peut y être contraint."},{"i":6,"t":"Principes et valeurs de la République","m":"NAT","q":"La liberté d'expression sur les réseaux sociaux en France est :","a":"Garantie, mais encadrée par les mêmes limites qu'ailleurs : ni injure, ni diffamation, ni harcèlement, ni provocation à la haine ou à la violence."},{"i":7,"t":"Principes et valeurs de la République","m":"NAT","q":"Lequel de ces prénoms évoque un symbole de la République ?","a":"Marianne."},{"i":8,"t":"Principes et valeurs de la République","m":"NAT","q":"Lequel de ces symboles représente la République française ?","a":"Le drapeau tricolore, La Marseillaise, la devise, Marianne ou le coq."},{"i":9,"t":"Principes et valeurs de la République","m":"NAT","q":"Où peut-on voir la devise de la République ?","a":"Sur le fronton des mairies, des écoles et des bâtiments publics, ainsi que sur les pièces de monnaie et les documents officiels."},{"i":10,"t":"Principes et valeurs de la République","m":"NAT","q":"Lesquels sont des symboles officiels de la République française ?","a":"Le drapeau tricolore, La Marseillaise et la devise « Liberté, Égalité, Fraternité », inscrits à l'article 2 de la Constitution."},{"i":11,"t":"Principes et valeurs de la République","m":"NAT","q":"Peut-on brûler publiquement un drapeau français ?","a":"Non. L'outrage public au drapeau national est une infraction sanctionnée."},{"i":12,"t":"Principes et valeurs de la République","m":"NAT","q":"Quand la sécurité sociale a-t-elle été établie en France ?","a":"En 1945, au lendemain de la Seconde Guerre mondiale."},{"i":13,"t":"Principes et valeurs de la République","m":"NAT","q":"Que commémore la fête nationale ?","a":"La prise de la Bastille du 14 juillet 1789 et la Fête de la Fédération du 14 juillet 1790."},{"i":14,"t":"Principes et valeurs de la République","m":"NAT","q":"Que porte Marianne sur la tête ?","a":"Un bonnet phrygien, symbole de liberté."},{"i":15,"t":"Principes et valeurs de la République","m":"NAT","q":"Que signifie le mot “fraternité” dans la devise française ?","a":"La solidarité et l'entraide entre les membres de la société : voir en autrui un semblable malgré les différences. C'est une fraternité civique, ni ethnique ni religieuse."},{"i":16,"t":"Principes et valeurs de la République","m":"NAT","q":"Quel symbole de la République peut-on voir sur les maillots de l'équipe de France de football ?","a":"Le coq."},{"i":17,"t":"Principes et valeurs de la République","m":"NAT","q":"Quelle est la devise de la République française ?","a":"Liberté, Égalité, Fraternité."},{"i":18,"t":"Principes et valeurs de la République","m":"NAT","q":"Qu'est-ce que la liberté d'association ?","a":"Le droit de créer une association ou d'y adhérer librement, sans autorisation préalable de l'État."},{"i":19,"t":"Principes et valeurs de la République","m":"NAT","q":"Qu'est-ce qu'une liberté ?","a":"Le droit de faire tout ce qui ne nuit pas à autrui, dans les limites fixées par la loi."},{"i":20,"t":"Principes et valeurs de la République","m":"NAT","q":"Selon la Constitution, la France est une République…","a":"Indivisible, laïque, démocratique et sociale."},{"i":21,"t":"Principes et valeurs de la République","m":"NAT","q":"Sur quel document peut-on voir Marianne ?","a":"Les timbres-poste, les pièces d'euro françaises et les documents officiels de l'administration."},{"i":22,"t":"Principes et valeurs de la République","m":"NAT","q":"Une des valeurs de la devise républicaine est l'Égalité. Qu'est-ce que cela signifie ?","a":"Que toutes les personnes ont les mêmes droits et les mêmes devoirs et sont traitées également par la loi, sans distinction d'origine, de sexe, de religion ou de handicap."},{"i":23,"t":"Principes et valeurs de la République","m":"NAT","q":"Une personne peut-elle changer librement de religion en France ?","a":"Oui, comme elle peut cesser de croire. C'est la liberté de conscience, qui inclut le droit de se convertir et le droit d'apostasie."},{"i":24,"t":"Principes et valeurs de la République","m":"NAT","q":"Selon le principe de laïcité, que signifie la neutralité de l'État ?","a":"Que l'État ne reconnaît, ne salarie ni ne subventionne aucun culte, ne privilégie ni ne défavorise aucune religion, et que ses agents n'affichent aucune conviction dans l'exercice de leurs fonctions."},{"i":25,"t":"Principes et valeurs de la République","m":"NAT","q":"Que peut faire un usager du service public dans une mairie ?","a":"Il peut exprimer ses convictions et porter un signe religieux, dans le respect de l'ordre public. Il ne peut pas faire de prosélytisme, ni exiger un traitement particulier ou récuser un agent en raison de sa religion ou de son sexe."},{"i":26,"t":"Principes et valeurs de la République","m":"NAT","q":"En France, il est possible pour l'État de financer :","a":"Aucun culte. Il peut en revanche entretenir les édifices religieux construits avant 1905 dont il est propriétaire, et assurer la sécurité des lieux de culte."},{"i":27,"t":"Principes et valeurs de la République","m":"NAT","q":"En quelle année la loi de séparation des Églises et de l'État a-t-elle été votée ?","a":"1905, le 9 décembre."},{"i":28,"t":"Principes et valeurs de la République","m":"NAT","q":"Que dit la loi de 1905 ?","a":"Elle garantit la liberté de conscience et le libre exercice des cultes, et pose que la République ne reconnaît, ne salarie ni ne subventionne aucun culte."},{"i":29,"t":"Principes et valeurs de la République","m":"NAT","q":"Que garantit le principe de laïcité ?","a":"La liberté de conscience, la neutralité de l'État et l'égalité de tous devant la loi quelles que soient les convictions."},{"i":30,"t":"Principes et valeurs de la République","m":"NAT","q":"Quel jour célèbre-t-on officiellement la laïcité en France ?","a":"Le 9 décembre, date anniversaire de la loi de 1905."},{"i":31,"t":"Principes et valeurs de la République","m":"NAT","q":"Quel symbole religieux peut être porté dans une école publique dans le respect de la laïcité ?","a":"Seulement un signe discret. La loi du 15 mars 2004 interdit aux élèves les signes religieux ostensibles dans les écoles, collèges et lycées publics."},{"i":32,"t":"Principes et valeurs de la République","m":"NAT","q":"Quel terme désigne précisément la haine ou les préjugés contre les Juifs ?","a":"L'antisémitisme. Les propos et actes antisémites sont des infractions pénales."},{"i":33,"t":"Principes et valeurs de la République","m":"NAT","q":"Quel texte est considéré comme le texte fondateur de la laïcité ?","a":"La loi du 9 décembre 1905 de séparation des Églises et de l'État."},{"i":34,"t":"Principes et valeurs de la République","m":"NAT","q":"Quelle institution française doit rester neutre en matière de religion ?","a":"L'État et l'ensemble des services publics, ainsi que tous leurs agents."},{"i":35,"t":"Principes et valeurs de la République","m":"NAT","q":"Qu'est-ce que la laïcité ?","a":"Un principe qui garantit la liberté de conscience, impose la neutralité de l'État et assure l'égalité de tous quelles que soient leurs croyances. Ce n'est ni une religion, ni une opinion, ni la négation des religions."},{"i":36,"t":"Principes et valeurs de la République","m":"NAT","q":"À l'école, la charte de la laïcité permet de :","a":"Rappeler à toute la communauté scolaire — élèves, personnels et parents — les règles de la laïcité et leurs applications concrètes. Publiée en 2013, elle compte quinze articles et son affichage est obligatoire."},{"i":37,"t":"Principes et valeurs de la République","m":"NAT","q":"Qui doit respecter et veiller à la neutralité religieuse dans les services publics ?","a":"Tous les agents publics, sans exception, pendant l'exercice de leurs fonctions."},{"i":38,"t":"Principes et valeurs de la République","m":"NAT","q":"Une personne déclare ne croire en aucun dieu. On peut dire :","a":"Qu'elle est athée. C'est un droit protégé par la liberté de conscience."},{"i":39,"t":"Système institutionnel et politique","m":"NAT","q":"Comment est désigné le Premier ministre ?","a":"Il est nommé par le président de la République."},{"i":40,"t":"Système institutionnel et politique","m":"NAT","q":"Qui peut se présenter aux élections présidentielles ?","a":"Tout citoyen français majeur, jouissant de ses droits civils et politiques, et parrainé par 500 élus."},{"i":41,"t":"Système institutionnel et politique","m":"NAT","q":"À qui appartient la souveraineté nationale ?","a":"Au peuple, qui l'exerce par ses représentants élus et par la voie du référendum (article 3 de la Constitution)."},{"i":42,"t":"Système institutionnel et politique","m":"NAT","q":"Qui est élu lors des élections municipales ?","a":"Les conseillers municipaux, qui élisent ensuite le maire parmi eux."},{"i":43,"t":"Système institutionnel et politique","m":"NAT","q":"L'inscription sur les listes électorales est :","a":"Indispensable pour voter. Elle est automatique à 18 ans pour les jeunes recensés, et doit sinon être demandée, notamment après un déménagement."},{"i":44,"t":"Système institutionnel et politique","m":"NAT","q":"Quelle condition est nécessaire pour voter aux élections présidentielles ?","a":"Être de nationalité française, majeur, jouir de ses droits civils et politiques et être inscrit sur les listes électorales."},{"i":45,"t":"Système institutionnel et politique","m":"NAT","q":"Quelle condition faut-il remplir pour être candidat aux élections municipales ?","a":"Être majeur, français ou citoyen d'un autre État de l'Union européenne, et être inscrit sur la liste électorale de la commune ou y être contribuable."},{"i":46,"t":"Système institutionnel et politique","m":"NAT","q":"Parmi ces autorités, laquelle est élue ?","a":"Le maire, le député, le sénateur, le conseiller municipal, départemental ou régional, ou le président de la République. Le préfet, lui, est nommé."},{"i":47,"t":"Système institutionnel et politique","m":"NAT","q":"Quelles sont les fonctions du maire ?","a":"Il dirige la commune et exécute les décisions du conseil municipal. Il est aussi agent de l'État : officier d'état civil et officier de police judiciaire."},{"i":48,"t":"Système institutionnel et politique","m":"NAT","q":"Une personne, n'ayant pas d'accès à internet, veut s'inscrire sur les listes électorales. Où peut-elle s'inscrire ?","a":"À la mairie de son domicile."},{"i":49,"t":"Système institutionnel et politique","m":"NAT","q":"À quel âge peut-on devenir électeur ?","a":"18 ans."},{"i":50,"t":"Système institutionnel et politique","m":"NAT","q":"En France, est-ce obligatoire de voter ?","a":"Non. Le vote est un droit et un devoir civique, mais il n'est pas obligatoire."},{"i":51,"t":"Système institutionnel et politique","m":"NAT","q":"A-t-on le droit de ne pas respecter une loi ?","a":"Non. La loi s'impose à tous, y compris aux autorités publiques, et ne pas la respecter expose à une sanction."},{"i":52,"t":"Système institutionnel et politique","m":"NAT","q":"Comment sont désignés les députés ?","a":"Ils sont élus par les citoyens au suffrage universel direct, pour cinq ans."},{"i":53,"t":"Système institutionnel et politique","m":"NAT","q":"Qui vote les lois ?","a":"Le Parlement, c'est-à-dire l'Assemblée nationale et le Sénat."},{"i":54,"t":"Système institutionnel et politique","m":"NAT","q":"La séparation des pouvoirs est un principe fondamental. Quels sont les trois pouvoirs concernés ?","a":"Le pouvoir législatif, le pouvoir exécutif et l'autorité judiciaire."},{"i":55,"t":"Système institutionnel et politique","m":"NAT","q":"Qu'est-ce que l'État de droit ?","a":"Un système dans lequel la loi est au-dessus de tous et s'applique à toutes les personnes, y compris aux autorités publiques. Cela garantit que les droits et libertés de chacun sont protégés."},{"i":56,"t":"Système institutionnel et politique","m":"NAT","q":"Quelles sont les durées du mandat du conseil municipal et du maire ?","a":"Six ans pour l'un comme pour l'autre."},{"i":57,"t":"Système institutionnel et politique","m":"NAT","q":"Qui est élu lors des élections législatives ?","a":"Les députés."},{"i":58,"t":"Système institutionnel et politique","m":"NAT","q":"Quelle est la durée du mandat du Président de la République française ?","a":"Cinq ans, renouvelable une fois consécutivement."},{"i":59,"t":"Système institutionnel et politique","m":"NAT","q":"Quelle est la durée du mandat des députés ?","a":"Cinq ans."},{"i":60,"t":"Système institutionnel et politique","m":"NAT","q":"Quelle est la durée du mandat des sénateurs ?","a":"Six ans, avec un renouvellement par moitié tous les trois ans."},{"i":61,"t":"Système institutionnel et politique","m":"NAT","q":"Qui dirige l'action du gouvernement ?","a":"Le Premier ministre."},{"i":62,"t":"Système institutionnel et politique","m":"NAT","q":"En France, est-ce possible d'adhérer à un parti politique ?","a":"Oui, librement. Les partis se forment et exercent leur activité librement, et l'adhésion est facultative."},{"i":63,"t":"Système institutionnel et politique","m":"NAT","q":"Qui sanctionne l'auteur d'un vol ?","a":"Le juge, c'est-à-dire l'autorité judiciaire. Ni la police ni le maire ne prononcent la sanction."},{"i":64,"t":"Système institutionnel et politique","m":"NAT","q":"Qui gère les collèges publics ?","a":"Le département."},{"i":65,"t":"Système institutionnel et politique","m":"NAT","q":"Qui gère les écoles primaires et maternelles publiques ?","a":"La commune."},{"i":66,"t":"Système institutionnel et politique","m":"NAT","q":"Comment sont désignés les maires ?","a":"Ils sont élus par le conseil municipal, lui-même élu par les habitants."},{"i":67,"t":"Système institutionnel et politique","m":"NAT","q":"Quelle collectivité territoriale est responsable des transports régionaux ?","a":"La région."},{"i":68,"t":"Système institutionnel et politique","m":"NAT","q":"Quelle est l'une des voies possibles pour modifier la Constitution ?","a":"Après un vote en termes identiques par l'Assemblée nationale et le Sénat, soit par référendum, soit par un vote du Parlement réuni en Congrès à la majorité des trois cinquièmes."},{"i":69,"t":"Système institutionnel et politique","m":"NAT","q":"Qui assure l'intérim du président de la République en cas de décès ?","a":"Le président du Sénat."},{"i":70,"t":"Système institutionnel et politique","m":"NAT","q":"Quel est le rôle du Conseil constitutionnel ?","a":"Vérifier la conformité des lois à la Constitution et veiller à la régularité des élections nationales et des référendums."},{"i":71,"t":"Système institutionnel et politique","m":"NAT","q":"Quelle condition est obligatoire pour se présenter à l'élection présidentielle ?","a":"Réunir 500 parrainages d'élus, en plus d'être français, majeur et de jouir de ses droits."},{"i":72,"t":"Système institutionnel et politique","m":"NAT","q":"Combien y a-t-il de départements en France ?","a":"101 : 96 en métropole et 5 en outre-mer."},{"i":73,"t":"Système institutionnel et politique","m":"NAT","q":"Comment est organisé le découpage administratif de la France ?","a":"En trois niveaux de collectivités territoriales — la commune, le département, la région — auxquels s'ajoute l'État, représenté localement par le préfet."},{"i":74,"t":"Système institutionnel et politique","m":"NAT","q":"Qui représente l'État dans un département ?","a":"Le préfet."},{"i":75,"t":"Système institutionnel et politique","m":"NAT","q":"Quel est le rôle du Président de la République ?","a":"Chef de l'État et chef des armées, garant de la Constitution, il nomme le Premier ministre et les ministres, préside le conseil des ministres, promulgue les lois et peut dissoudre l'Assemblée nationale."},{"i":76,"t":"Système institutionnel et politique","m":"NAT","q":"Quel est le rôle du Premier ministre ?","a":"Il est le chef du Gouvernement : il dirige son action, assure l'exécution des lois et exerce le pouvoir réglementaire."},{"i":77,"t":"Système institutionnel et politique","m":"NAT","q":"Quel est le rôle du Défenseur des droits ?","a":"C'est une autorité indépendante qui défend les droits et libertés face aux administrations, lutte contre les discriminations et protège les droits de l'enfant. Sa saisine est gratuite."},{"i":78,"t":"Système institutionnel et politique","m":"NAT","q":"En quelle année la citoyenneté européenne a-t-elle été créée ?","a":"1992, par le traité de Maastricht."},{"i":79,"t":"Système institutionnel et politique","m":"NAT","q":"Quel est le dernier État à avoir intégré l'Union européenne en 2013 ?","a":"La Croatie."},{"i":80,"t":"Système institutionnel et politique","m":"NAT","q":"Qui a composé l'hymne de l'Union européenne ?","a":"Ludwig van Beethoven. L'hymne est l'Ode à la joie, tirée de sa Neuvième symphonie."},{"i":81,"t":"Système institutionnel et politique","m":"NAT","q":"Quand est célébrée la journée de l'Europe ?","a":"Le 9 mai, en référence à la déclaration Schuman du 9 mai 1950."},{"i":82,"t":"Système institutionnel et politique","m":"NAT","q":"Où est le siège de la Banque centrale européenne ?","a":"Francfort, en Allemagne."},{"i":83,"t":"Système institutionnel et politique","m":"NAT","q":"Où est le siège de la Commission européenne ?","a":"Bruxelles."},{"i":84,"t":"Système institutionnel et politique","m":"NAT","q":"Qui siège au Parlement européen ?","a":"Les députés européens, élus au suffrage universel direct par les citoyens des États membres."},{"i":85,"t":"Système institutionnel et politique","m":"NAT","q":"Les citoyens de l'Union européenne peuvent-ils voter aux élections locales dans un autre État de l'Union ?","a":"Oui. Un citoyen européen résidant en France peut voter aux élections municipales et européennes, mais pas aux présidentielles ni aux législatives."},{"i":86,"t":"Système institutionnel et politique","m":"NAT","q":"Combien d'États font partie de l'Union européenne au 1er janvier 2025 ?","a":"27."},{"i":87,"t":"Système institutionnel et politique","m":"NAT","q":"En quelle année le traité de Maastricht, qui marque la fondation de l'Union européenne, a-t-il été signé ?","a":"1992."},{"i":88,"t":"Système institutionnel et politique","m":"NAT","q":"Quel traité concerne la construction de l'Union européenne ?","a":"Le traité de Maastricht, qui la fonde en 1992. Les traités de Paris (1951) et de Rome (1957) l'ont précédée, celui de Lisbonne (2007) l'a réformée."},{"i":89,"t":"Système institutionnel et politique","m":"NAT","q":"Quel État a quitté l'Union européenne en 2020 ?","a":"Le Royaume-Uni, le 31 janvier 2020."},{"i":90,"t":"Système institutionnel et politique","m":"NAT","q":"Quelle est la devise de l'Union européenne ?","a":"« Unie dans la diversité »."},{"i":91,"t":"Système institutionnel et politique","m":"NAT","q":"Quel est l'hymne de l'Union européenne ?","a":"L'Ode à la joie, extraite de la Neuvième symphonie de Beethoven."},{"i":92,"t":"Système institutionnel et politique","m":"NAT","q":"De quoi est composé le drapeau européen ?","a":"De douze étoiles dorées disposées en cercle sur fond bleu. Le nombre douze symbolise la perfection et l'unité, il ne correspond pas au nombre d'États membres."},{"i":93,"t":"Système institutionnel et politique","m":"NAT","q":"Qui élit les députés européens ?","a":"Les citoyens de l'Union européenne, au suffrage universel direct, tous les cinq ans."},{"i":94,"t":"Système institutionnel et politique","m":"NAT","q":"Où est le siège du Parlement européen ?","a":"Strasbourg."},{"i":95,"t":"Droits et devoirs","m":"NAT","q":"À quoi sert le droit de grève ?","a":"À cesser collectivement le travail pour défendre des revendications professionnelles. C'est un droit de valeur constitutionnelle."},{"i":96,"t":"Droits et devoirs","m":"NAT","q":"Au nom de quoi l'État justifie-t-il la restriction des droits ?","a":"De l'ordre public — sécurité, tranquillité, salubrité —, du respect de la dignité humaine et de la protection des droits d'autrui. La restriction doit être prévue par la loi et proportionnée."},{"i":97,"t":"Droits et devoirs","m":"NAT","q":"Laquelle de ces citations est inscrite dans la Déclaration des droits de l'homme et du citoyen de 1789 ?","a":"« Les hommes naissent et demeurent libres et égaux en droits », article 1er."},{"i":98,"t":"Droits et devoirs","m":"NAT","q":"L'article 4 de la Déclaration des droits de l'homme et du citoyen affirme que \"la liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui\". Qu'est-ce que cela signifie ?","a":"Que la liberté de chacun s'arrête là où commence celle des autres : elle n'est pas absolue et la loi en fixe les limites."},{"i":99,"t":"Droits et devoirs","m":"NAT","q":"Que dit l'article 1er de la Constitution française ?","a":"Que la France est une République indivisible, laïque, démocratique et sociale, qui assure l'égalité devant la loi de tous les citoyens sans distinction d'origine, de race ou de religion, et respecte toutes les croyances."},{"i":100,"t":"Droits et devoirs","m":"NAT","q":"Que garantit la liberté de la presse ?","a":"Le droit d'informer et de publier sans censure ni autorisation préalable de l'État, dans les limites de la loi."},{"i":101,"t":"Droits et devoirs","m":"NAT","q":"Que permet la liberté de circulation ?","a":"D'aller et venir librement, de se déplacer et de s'installer où l'on veut sur le territoire, sans autorisation préalable."},{"i":102,"t":"Droits et devoirs","m":"NAT","q":"Que signifie être citoyen d'un État ?","a":"Disposer de droits, notamment le droit de vote et d'éligibilité, et être tenu à des devoirs : respecter la loi, payer ses impôts, participer à un jury."},{"i":103,"t":"Droits et devoirs","m":"NAT","q":"Que sont les droits fondamentaux ?","a":"Les droits reconnus à toute personne du seul fait qu'elle est un être humain, protégés par des textes de valeur constitutionnelle et opposables à l'État."},{"i":104,"t":"Droits et devoirs","m":"NAT","q":"Quel droit protège une personne contre une arrestation arbitraire ?","a":"Le droit à la sûreté, garanti par la Déclaration de 1789."},{"i":105,"t":"Droits et devoirs","m":"NAT","q":"Quel est le texte fondateur établissant les droits et les devoirs de chaque citoyen ?","a":"La Déclaration des droits de l'homme et du citoyen de 1789."},{"i":106,"t":"Droits et devoirs","m":"NAT","q":"Quel texte affirme que tous les hommes naissent libres et égaux en droits ?","a":"La Déclaration des droits de l'homme et du citoyen du 26 août 1789."},{"i":107,"t":"Droits et devoirs","m":"NAT","q":"Quelle situation est une atteinte à la dignité humaine ?","a":"L'esclavage, la traite des êtres humains, la torture, les traitements inhumains ou dégradants, l'exploitation d'une personne comme un objet."},{"i":108,"t":"Droits et devoirs","m":"NAT","q":"Qu'est-ce que la liberté d'expression ?","a":"Le droit de dire, d'écrire et de publier ses opinions, y compris critiques, dans les limites fixées par la loi."},{"i":109,"t":"Droits et devoirs","m":"NAT","q":"Suite à une interpellation par la police, il est possible de :","a":"Être informé de ses droits, garder le silence, être assisté d'un avocat, faire prévenir un proche et demander à voir un médecin."},{"i":110,"t":"Droits et devoirs","m":"NAT","q":"Tous les citoyens français ont-ils une religion ?","a":"Non. Chacun est libre de croire, de ne pas croire ou de ne plus croire."},{"i":111,"t":"Droits et devoirs","m":"NAT","q":"À quel âge est la majorité numérique en France ?","a":"15 ans : en dessous, l'inscription sur un réseau social requiert l'accord des parents."},{"i":112,"t":"Droits et devoirs","m":"NAT","q":"Dans lequel de ces endroits est-on autorisé à fumer ?","a":"En extérieur, dans les lieux non couverts où ce n'est pas interdit. Fumer est interdit dans tous les lieux publics fermés et couverts, dans les transports et sur les aires de jeux."},{"i":113,"t":"Droits et devoirs","m":"NAT","q":"En France, la conduite sans permis d'une moto est :","a":"Illégale : c'est un délit, sanctionné par une amende et une possible peine de prison."},{"i":114,"t":"Droits et devoirs","m":"NAT","q":"En quoi consiste le devoir de solidarité ?","a":"À contribuer aux charges publiques par l'impôt et les cotisations, et à soutenir les plus fragiles. La solidarité est aussi intergénérationnelle, par exemple pour les retraites."},{"i":115,"t":"Droits et devoirs","m":"NAT","q":"Est-ce légal d'être marié à plusieurs personnes en même temps ?","a":"Non. La polygamie est interdite et sanctionnée."},{"i":116,"t":"Droits et devoirs","m":"NAT","q":"Est-ce obligatoire de déclarer ses impôts chaque année en France ?","a":"Oui, pour toute personne résidant fiscalement en France, même sans impôt à payer."},{"i":117,"t":"Droits et devoirs","m":"NAT","q":"Est-il obligatoire de porter secours à une personne en danger ?","a":"Oui, dans la mesure où l'on peut le faire sans risque pour soi ou pour autrui. Ne pas le faire est le délit de non-assistance à personne en danger."},{"i":118,"t":"Droits et devoirs","m":"NAT","q":"Être juré d'assises est :","a":"Obligatoire pour le citoyen tiré au sort. C'est un devoir civique dont on ne peut se dispenser que pour un motif légitime."},{"i":119,"t":"Droits et devoirs","m":"NAT","q":"La vente d'alcool en France est interdite aux personnes de moins de :","a":"18 ans."},{"i":120,"t":"Droits et devoirs","m":"NAT","q":"Le non-respect du code de la route est :","a":"Sanctionné : contravention le plus souvent, délit dans les cas graves comme la conduite en état d'ivresse ou le délit de fuite."},{"i":121,"t":"Droits et devoirs","m":"NAT","q":"Lequel de ces crimes ou délits peut entraîner la privation des droits civils et politiques par un juge ?","a":"Notamment la fraude électorale, la corruption, les atteintes graves aux personnes et les crimes. La privation est une peine complémentaire prononcée par le juge."},{"i":122,"t":"Droits et devoirs","m":"NAT","q":"Pour obtenir une carte d'identité, il faut :","a":"Être de nationalité française et fournir un justificatif d'identité, une photo et un justificatif de domicile. La demande se fait en mairie."},{"i":123,"t":"Droits et devoirs","m":"NAT","q":"Pour quel motif peut-on limiter la liberté d'expression ?","a":"L'injure, la diffamation, la provocation à la haine, à la discrimination ou à la violence, l'apologie du terrorisme, l'atteinte à la vie privée."},{"i":124,"t":"Droits et devoirs","m":"NAT","q":"Que doit faire un citoyen s'il est appelé à être juré dans un procès d'assises ?","a":"Il doit se présenter : la fonction est obligatoire. Son employeur ne peut pas s'y opposer et l'absence sans motif légitime est sanctionnée."},{"i":125,"t":"Droits et devoirs","m":"NAT","q":"Quel est l'âge de la majorité civile en France ?","a":"18 ans."},{"i":126,"t":"Droits et devoirs","m":"NAT","q":"Quel est l'un des devoirs principaux d'un citoyen français ?","a":"Respecter la loi, payer ses impôts, être juré d'assises si l'on est tiré au sort, se faire recenser à 16 ans, défendre la Nation en cas de danger."},{"i":127,"t":"Droits et devoirs","m":"NAT","q":"Quelle est l'infraction la plus grave ?","a":"Le crime."},{"i":128,"t":"Droits et devoirs","m":"NAT","q":"Qu'est-ce que la citoyenneté numérique ?","a":"L'exercice de ses droits et de ses devoirs en ligne : les règles y sont les mêmes que dans la vie réelle, y compris pour l'injure, le harcèlement et le respect de la vie privée."},{"i":129,"t":"Droits et devoirs","m":"NAT","q":"Qu'est-ce que le devoir de mémoire ?","a":"L'obligation morale de se souvenir des événements tragiques de l'histoire, notamment la Shoah, pour honorer les victimes et empêcher que cela se reproduise."},{"i":130,"t":"Droits et devoirs","m":"NAT","q":"Qui peut être appelé à faire partie d'un jury d'assises en France ?","a":"Tout citoyen français âgé d'au moins 23 ans, sachant lire et écrire le français et jouissant de ses droits civils et politiques, tiré au sort sur les listes électorales."},{"i":131,"t":"Droits et devoirs","m":"NAT","q":"Une personne est privée de ses droits civils et politiques pendant 5 ans suite à une condamnation. Pendant 5 ans,…","a":"Elle ne peut ni voter, ni être élue, ni être jurée d'assises, ni exercer certaines fonctions publiques."},{"i":132,"t":"Histoire, géographie et culture","m":"NAT","q":"Parmi ces textes, lequel a été adopté sous Napoléon Ier ?","a":"Le Code civil, en 1804."},{"i":133,"t":"Histoire, géographie et culture","m":"NAT","q":"Qui a été président de la Ve République ?","a":"Charles de Gaulle, Georges Pompidou, Valéry Giscard d'Estaing, François Mitterrand, Jacques Chirac, Nicolas Sarkozy, François Hollande ou Emmanuel Macron."},{"i":134,"t":"Histoire, géographie et culture","m":"NAT","q":"Quel est l'objectif des lois scolaires de la IIIe République ?","a":"Rendre l'école gratuite, laïque et obligatoire, afin d'instruire tous les enfants et de former des citoyens éclairés."},{"i":135,"t":"Histoire, géographie et culture","m":"NAT","q":"Que signifie la date du 14 juillet pour les Français ?","a":"C'est la fête nationale : elle commémore la prise de la Bastille de 1789 et la Fête de la Fédération de 1790."},{"i":136,"t":"Histoire, géographie et culture","m":"NAT","q":"Pourquoi l'année 1958 est importante pour la France ?","a":"C'est l'année de la fondation de la Ve République et de la Constitution du 4 octobre 1958."},{"i":137,"t":"Histoire, géographie et culture","m":"NAT","q":"Lequel de ces pays est un pays fondateur de l'Union européenne ?","a":"La France, l'Allemagne, l'Italie, la Belgique, les Pays-Bas ou le Luxembourg."},{"i":138,"t":"Histoire, géographie et culture","m":"NAT","q":"Simone Veil est une figure importante de l'histoire française. Elle a notamment :","a":"Porté la loi de 1975 légalisant l'interruption volontaire de grossesse, et présidé le Parlement européen. Rescapée de la Shoah, elle est entrée au Panthéon en 2018."},{"i":139,"t":"Histoire, géographie et culture","m":"NAT","q":"Dans quelle région est située une partie des plages du débarquement ayant permis d'engager la libération de la France ?","a":"La Normandie."},{"i":140,"t":"Histoire, géographie et culture","m":"NAT","q":"Dans quelle ville les rois de France étaient-ils couronnés ?","a":"Reims."},{"i":141,"t":"Histoire, géographie et culture","m":"NAT","q":"Quel roi de France a été guillotiné pendant la Révolution française ?","a":"Louis XVI, en 1793."},{"i":142,"t":"Histoire, géographie et culture","m":"NAT","q":"En quelle année a débuté la Révolution française ?","a":"1789."},{"i":143,"t":"Histoire, géographie et culture","m":"NAT","q":"En quelle année Napoléon Ier est-il devenu empereur ?","a":"1804."},{"i":144,"t":"Histoire, géographie et culture","m":"NAT","q":"Lequel de ces personnages a un lien avec la République française ?","a":"Marianne, Charles de Gaulle, Jules Ferry, Victor Schoelcher ou Simone Veil, selon les options."},{"i":145,"t":"Histoire, géographie et culture","m":"NAT","q":"De quand date l'appel à la résistance du général de Gaulle ?","a":"Du 18 juin 1940, lancé depuis Londres à la radio."},{"i":146,"t":"Histoire, géographie et culture","m":"NAT","q":"Qu'est-ce que la Shoah ?","a":"Le génocide des Juifs d'Europe organisé par l'Allemagne nazie pendant la Seconde Guerre mondiale : environ six millions de personnes assassinées."},{"i":147,"t":"Histoire, géographie et culture","m":"NAT","q":"Quel pays a été une colonie française ?","a":"L'Algérie, le Maroc, la Tunisie, le Sénégal, le Mali, la Côte d'Ivoire, Madagascar ou le Vietnam."},{"i":148,"t":"Histoire, géographie et culture","m":"NAT","q":"Qui a rendu l'école gratuite, laïque et obligatoire ?","a":"Jules Ferry, par les lois de 1881 et 1882."},{"i":149,"t":"Histoire, géographie et culture","m":"NAT","q":"Depuis quand les Français élisent-ils le président de la République au suffrage universel direct ?","a":"Depuis la réforme de 1962, appliquée pour la première fois en 1965."},{"i":150,"t":"Histoire, géographie et culture","m":"NAT","q":"En quelle année l'Union européenne a-t-elle été fondée ?","a":"1992, par le traité de Maastricht."},{"i":151,"t":"Histoire, géographie et culture","m":"NAT","q":"Quand a eu lieu la Seconde Guerre mondiale ?","a":"De 1939 à 1945."},{"i":152,"t":"Histoire, géographie et culture","m":"NAT","q":"Quand a eu lieu la Première Guerre mondiale ?","a":"De 1914 à 1918."},{"i":153,"t":"Histoire, géographie et culture","m":"NAT","q":"Sous quel président a été abolie la peine de mort en France ?","a":"François Mitterrand, en 1981. La loi a été portée par Robert Badinter."},{"i":154,"t":"Histoire, géographie et culture","m":"NAT","q":"Que célèbre-t-on le 8 mai ?","a":"La victoire des Alliés et la fin de la Seconde Guerre mondiale en Europe, en 1945."},{"i":155,"t":"Histoire, géographie et culture","m":"NAT","q":"Quelle est la première étape de la construction européenne en 1951 ?","a":"La Communauté européenne du charbon et de l'acier, la CECA, créée par le traité de Paris."},{"i":156,"t":"Histoire, géographie et culture","m":"NAT","q":"Qui était une figure de la Résistance française pendant la Seconde Guerre mondiale ?","a":"Jean Moulin, Lucie Aubrac, Charles de Gaulle ou Joséphine Baker."},{"i":157,"t":"Histoire, géographie et culture","m":"NAT","q":"Le 11 novembre est un jour férié. À quoi correspond cette date ?","a":"À l'armistice du 11 novembre 1918, qui met fin à la Première Guerre mondiale."},{"i":158,"t":"Histoire, géographie et culture","m":"NAT","q":"Depuis quand l'esclavage a-t-il été aboli en France ?","a":"Depuis 1848, de façon définitive. Une première abolition en 1794 avait été annulée en 1802."},{"i":159,"t":"Histoire, géographie et culture","m":"NAT","q":"Qui a aboli l'esclavage en France ?","a":"Victor Schoelcher, à l'origine du décret d'abolition de 1848."},{"i":160,"t":"Histoire, géographie et culture","m":"NAT","q":"Depuis quelle année l'école publique est-elle gratuite ?","a":"1881. Elle devient obligatoire et laïque en 1882."},{"i":161,"t":"Histoire, géographie et culture","m":"NAT","q":"En 1944, qu'est-ce qui a changé pour les femmes ?","a":"Elles obtiennent le droit de vote et le droit d'être élues."},{"i":162,"t":"Histoire, géographie et culture","m":"NAT","q":"Quelle organisation a été créée en 1945 après la Seconde Guerre mondiale ?","a":"L'Organisation des Nations unies, l'ONU. La France est l'un des cinq membres permanents de son Conseil de sécurité."},{"i":163,"t":"Histoire, géographie et culture","m":"NAT","q":"En quelle année l'euro est-il devenu la monnaie officielle de la France ?","a":"En 2002 pour les pièces et les billets. L'euro existe depuis 1999."},{"i":164,"t":"Histoire, géographie et culture","m":"NAT","q":"Lors de la Seconde Guerre mondiale, à quelle date la ville de Paris a-t-elle été libérée ?","a":"En août 1944, le 25 août."},{"i":165,"t":"Histoire, géographie et culture","m":"NAT","q":"Quel était le principal port français impliqué dans la traite négrière au XVIIIe siècle ?","a":"Nantes."},{"i":166,"t":"Histoire, géographie et culture","m":"NAT","q":"Quel célèbre philosophe des Lumières a dénoncé l'esclavage ?","a":"Montesquieu, dans De l'esprit des lois. Voltaire, Diderot et Condorcet l'ont également dénoncé."},{"i":167,"t":"Histoire, géographie et culture","m":"NAT","q":"Quelle œuvre a été écrite par Victor Hugo ?","a":"Les Misérables, Notre-Dame de Paris ou Les Contemplations."},{"i":168,"t":"Histoire, géographie et culture","m":"NAT","q":"Quel peintre est français ?","a":"Claude Monet, Auguste Renoir, Paul Cézanne, Edgar Degas ou Eugène Delacroix."},{"i":169,"t":"Histoire, géographie et culture","m":"NAT","q":"Quel plat est une spécialité de la cuisine française ?","a":"Le pot-au-feu, le bœuf bourguignon, la blanquette de veau, la ratatouille, le cassoulet ou la quiche lorraine."},{"i":170,"t":"Histoire, géographie et culture","m":"NAT","q":"Qui était Marie Curie ?","a":"Une physicienne et chimiste, seule femme à avoir reçu deux prix Nobel, et première femme entrée au Panthéon pour ses propres mérites."},{"i":171,"t":"Histoire, géographie et culture","m":"NAT","q":"Qui a peint \"La Liberté guidant le peuple\" ?","a":"Eugène Delacroix."},{"i":172,"t":"Histoire, géographie et culture","m":"NAT","q":"Dans quel grand musée parisien est exposée la Joconde ?","a":"Le Louvre."},{"i":173,"t":"Histoire, géographie et culture","m":"NAT","q":"Quel château célèbre se trouve près de Paris et symbolise le pouvoir royal de Louis XIV ?","a":"Le château de Versailles."},{"i":174,"t":"Histoire, géographie et culture","m":"NAT","q":"Où peut-on voir des peintures préhistoriques en France ?","a":"Dans la grotte de Lascaux, en Dordogne, ou dans la grotte Chauvet, en Ardèche."},{"i":175,"t":"Histoire, géographie et culture","m":"NAT","q":"Quel peintre célèbre a peint les Nymphéas ?","a":"Claude Monet."},{"i":176,"t":"Histoire, géographie et culture","m":"NAT","q":"Pendant quelles journées peut-on visiter gratuitement des lieux culturels en France ?","a":"Les Journées européennes du patrimoine, en septembre, et la Nuit européenne des musées, au printemps."},{"i":177,"t":"Histoire, géographie et culture","m":"NAT","q":"Que symbolise le 1er mai ?","a":"La fête du travail et la lutte pour les droits des travailleurs. C'est le seul jour férié obligatoirement chômé et payé."},{"i":178,"t":"Histoire, géographie et culture","m":"NAT","q":"Qui était Monsieur Rouget de Lisle ?","a":"L'auteur de La Marseillaise, qu'il composa à Strasbourg en 1792."},{"i":179,"t":"Histoire, géographie et culture","m":"NAT","q":"À quelle occasion a été construite la Tour Eiffel ?","a":"Pour l'Exposition universelle de Paris, en 1889."},{"i":180,"t":"Histoire, géographie et culture","m":"NAT","q":"Quelle chaîne de montagnes est située entre la France et l'Italie ?","a":"Les Alpes."},{"i":181,"t":"Histoire, géographie et culture","m":"NAT","q":"Qui était Molière ?","a":"Un auteur de théâtre et comédien français du XVIIe siècle."},{"i":182,"t":"Histoire, géographie et culture","m":"NAT","q":"Qui était Charles Baudelaire ?","a":"Un poète français du XIXe siècle, auteur des Fleurs du mal."},{"i":183,"t":"Histoire, géographie et culture","m":"NAT","q":"Qui était George Sand ?","a":"Une romancière française du XIXe siècle."},{"i":184,"t":"Histoire, géographie et culture","m":"NAT","q":"Qui était Simone de Beauvoir ?","a":"Une écrivaine et philosophe française, autrice du Deuxième Sexe."},{"i":185,"t":"Histoire, géographie et culture","m":"NAT","q":"Qui était Albert Camus ?","a":"Un écrivain français, prix Nobel de littérature en 1957."},{"i":186,"t":"Histoire, géographie et culture","m":"NAT","q":"Qui était Marguerite Yourcenar ?","a":"Une écrivaine française, première femme élue à l'Académie française, en 1980."},{"i":187,"t":"Histoire, géographie et culture","m":"NAT","q":"Qui était Paul Cézanne ?","a":"Un peintre français, figure du post-impressionnisme."},{"i":188,"t":"Histoire, géographie et culture","m":"NAT","q":"Qui était Auguste Rodin ?","a":"Un sculpteur français, auteur du Penseur."},{"i":189,"t":"Histoire, géographie et culture","m":"NAT","q":"Qui était un célèbre compositeur français ?","a":"Claude Debussy, Maurice Ravel, Hector Berlioz ou Camille Saint-Saëns."},{"i":190,"t":"Histoire, géographie et culture","m":"NAT","q":"Qui était Auguste Renoir ?","a":"Un peintre français, l'un des maîtres de l'impressionnisme."},{"i":191,"t":"Histoire, géographie et culture","m":"NAT","q":"Quel musée est situé à Paris ?","a":"Le Louvre, le musée d'Orsay, le Centre Pompidou ou le musée du quai Branly."},{"i":192,"t":"Histoire, géographie et culture","m":"NAT","q":"Quel monument historique se trouve sur une île en Normandie ?","a":"Le Mont-Saint-Michel."},{"i":193,"t":"Histoire, géographie et culture","m":"NAT","q":"Quelle ville française fait partie des 10 plus grandes métropoles du pays ?","a":"Paris, Marseille, Lyon, Toulouse, Nice, Nantes, Montpellier, Strasbourg, Bordeaux ou Lille."},{"i":194,"t":"Histoire, géographie et culture","m":"NAT","q":"Quelle île fait partie des Antilles françaises ?","a":"La Guadeloupe ou la Martinique."},{"i":195,"t":"Histoire, géographie et culture","m":"NAT","q":"Quelle île est française ?","a":"La Corse, la Guadeloupe, la Martinique, La Réunion ou Mayotte."},{"i":196,"t":"Histoire, géographie et culture","m":"NAT","q":"Quelle est la plus haute montagne de France ?","a":"Le mont Blanc, dans les Alpes, qui culmine à environ 4 806 mètres."},{"i":197,"t":"Histoire, géographie et culture","m":"NAT","q":"Quelle île française est située dans l'océan Indien ?","a":"La Réunion, ainsi que Mayotte."},{"i":198,"t":"Histoire, géographie et culture","m":"NAT","q":"Quel département français a une frontière avec le Brésil ?","a":"La Guyane."},{"i":199,"t":"Histoire, géographie et culture","m":"NAT","q":"De quelle ville française décolle la fusée Ariane ?","a":"Kourou, en Guyane."},{"i":200,"t":"Histoire, géographie et culture","m":"NAT","q":"Quelle mer ou océan borde la France métropolitaine ?","a":"La mer du Nord, la Manche, l'océan Atlantique et la mer Méditerranée."},{"i":201,"t":"Histoire, géographie et culture","m":"NAT","q":"Quelle mer se situe entre la France et l'Angleterre ?","a":"La Manche."},{"i":202,"t":"Histoire, géographie et culture","m":"NAT","q":"Quelle île est un département d'outre-mer français ?","a":"La Guadeloupe, la Martinique, La Réunion ou Mayotte. La Guyane est un département d'outre-mer mais n'est pas une île."},{"i":203,"t":"Histoire, géographie et culture","m":"NAT","q":"Qu'est-ce que la France d'outre-mer ?","a":"L'ensemble des territoires français situés hors d'Europe, dans les océans Atlantique, Indien et Pacifique. Ils font partie de la République française."},{"i":204,"t":"Histoire, géographie et culture","m":"NAT","q":"Quelle est la population approximative de la France en 2025 ?","a":"Environ 68 millions d'habitants."},{"i":205,"t":"Histoire, géographie et culture","m":"NAT","q":"Quel est le principal port maritime de France ?","a":"Marseille."},{"i":206,"t":"Histoire, géographie et culture","m":"NAT","q":"Combien y a-t-il de régions en France métropolitaine ?","a":"13. En comptant les cinq régions d'outre-mer, la France en compte 18."},{"i":207,"t":"Histoire, géographie et culture","m":"NAT","q":"Quelle chaîne de montagnes est située entre la France et l'Espagne ?","a":"Les Pyrénées."},{"i":208,"t":"Histoire, géographie et culture","m":"NAT","q":"Quelle île française se trouve au sud-est du continent africain ?","a":"Mayotte, dans le canal du Mozambique. La Réunion se situe plus à l'est, dans l'océan Indien."},{"i":209,"t":"Histoire, géographie et culture","m":"NAT","q":"Quel est le chef-lieu de la région Auvergne-Rhône-Alpes ?","a":"Lyon."},{"i":210,"t":"Histoire, géographie et culture","m":"NAT","q":"Quel est le chef-lieu de la région Bretagne ?","a":"Rennes."},{"i":211,"t":"Histoire, géographie et culture","m":"NAT","q":"Quel est le chef-lieu de la région Provence-Alpes-Côte d'Azur ?","a":"Marseille."},{"i":212,"t":"Histoire, géographie et culture","m":"NAT","q":"Quel est le 101e département français depuis 2011 ?","a":"Mayotte."},{"i":213,"t":"Histoire, géographie et culture","m":"NAT","q":"Quelle région française est réputée pour ses stations de ski ?","a":"Auvergne-Rhône-Alpes, dans les Alpes."},{"i":214,"t":"Histoire, géographie et culture","m":"NAT","q":"Quel fleuve traverse Paris ?","a":"La Seine."},{"i":215,"t":"Vivre dans la société française","m":"NAT","q":"Où faut-il déclarer la naissance d'un enfant ?","a":"À la mairie du lieu de naissance."},{"i":216,"t":"Vivre dans la société française","m":"NAT","q":"Quelle action peut réaliser le locataire d'un logement sans l'autorisation du propriétaire ?","a":"L'entretien courant et les aménagements simples, comme repeindre ou changer la décoration. Les transformations du logement exigent l'accord écrit du propriétaire."},{"i":217,"t":"Vivre dans la société française","m":"NAT","q":"Quel mariage est reconnu légalement ?","a":"Le mariage civil, célébré en mairie par un officier d'état civil. Un mariage religieux seul n'a aucun effet juridique."},{"i":218,"t":"Vivre dans la société française","m":"NAT","q":"Le stationnement sur une place réservée aux personnes handicapées :","a":"Est interdit sans carte mobilité inclusion et sanctionné par une amende, avec mise en fourrière possible."},{"i":219,"t":"Vivre dans la société française","m":"NAT","q":"Si une machine à laver est cassée, il est possible de :","a":"La faire réparer, la déposer en déchèterie, la faire reprendre par le vendeur lors d'un achat, ou la donner à une association. La laisser sur le trottoir est un dépôt sauvage sanctionné."},{"i":220,"t":"Vivre dans la société française","m":"NAT","q":"Dans quel cas faut-il déclarer son enfant au service d'état civil ?","a":"Dans tous les cas : toute naissance doit être déclarée, quels que soient la nationalité et le statut des parents."},{"i":221,"t":"Vivre dans la société française","m":"NAT","q":"Quand faut-il déclarer son enfant au service d'état civil ?","a":"Dans les cinq jours ouvrables suivant la naissance."},{"i":222,"t":"Vivre dans la société française","m":"NAT","q":"Quel numéro d'urgence permet d'appeler la police ?","a":"Le 17. Le 112, numéro européen, permet aussi de les joindre."},{"i":223,"t":"Vivre dans la société française","m":"NAT","q":"Quel numéro d'urgence permet d'appeler le SAMU ?","a":"Le 15."},{"i":224,"t":"Vivre dans la société française","m":"NAT","q":"Auprès de quelle institution les parents peuvent inscrire leurs enfants à l'école publique ?","a":"La mairie de la commune de résidence, puis l'établissement scolaire."},{"i":225,"t":"Vivre dans la société française","m":"NAT","q":"En cas de divorce, qui exerce l'autorité parentale ?","a":"Les deux parents conjointement. Le divorce ne met pas fin à l'autorité parentale ; seul un juge peut la retirer."},{"i":226,"t":"Vivre dans la société française","m":"NAT","q":"Quelle aide permet aux personnes qui ont des difficultés financières d'avoir un avocat ?","a":"L'aide juridictionnelle, qui prend en charge tout ou partie des frais d'avocat et de justice."},{"i":227,"t":"Vivre dans la société française","m":"NAT","q":"Qui peut demander le divorce de personnes mariées ?","a":"L'un ou l'autre des époux, ou les deux ensemble. Personne ne peut être contraint de rester marié."},{"i":228,"t":"Vivre dans la société française","m":"NAT","q":"Auprès de quel organisme faut-il demander le remboursement des frais de santé ?","a":"L'Assurance maladie, via la caisse primaire d'assurance maladie, la CPAM."},{"i":229,"t":"Vivre dans la société française","m":"NAT","q":"La contraception :","a":"Est libre et accessible à toutes les personnes qui le souhaitent, y compris aux mineures, de façon confidentielle et gratuite dans de nombreux cas."},{"i":230,"t":"Vivre dans la société française","m":"NAT","q":"Qu'est-ce que le principe de confidentialité dans le domaine de la santé ?","a":"L'obligation faite aux professionnels de santé de ne divulguer à personne les informations concernant un patient, y compris à sa famille ou à son employeur. C'est le secret médical."},{"i":231,"t":"Vivre dans la société française","m":"NAT","q":"À quoi sert la carte Vitale ?","a":"Elle atteste de vos droits à l'Assurance maladie et permet le remboursement automatique des soins."},{"i":232,"t":"Vivre dans la société française","m":"NAT","q":"À quoi sert une mutuelle santé ?","a":"À rembourser la part des frais de santé qui reste à votre charge après le remboursement de l'Assurance maladie."},{"i":233,"t":"Vivre dans la société française","m":"NAT","q":"Qu'est-ce que le tiers payant ?","a":"Un dispositif qui évite d'avancer les frais : l'Assurance maladie ou la mutuelle paie directement le professionnel de santé ou la pharmacie."},{"i":234,"t":"Vivre dans la société française","m":"NAT","q":"L'inscription à l'Assurance maladie est :","a":"Obligatoire. Ce n'est pas un choix."},{"i":235,"t":"Vivre dans la société française","m":"NAT","q":"L'avortement est-il possible en France ?","a":"Oui, légal depuis la loi Veil de 1975, dans le délai de quatorze semaines de grossesse. Depuis 2024, la liberté d'y recourir est garantie par la Constitution."},{"i":236,"t":"Vivre dans la société française","m":"NAT","q":"Travailler sans être déclaré est :","a":"Illégal. C'est un délit, qui prive le salarié de toute protection sociale et expose l'employeur à de lourdes sanctions."},{"i":237,"t":"Vivre dans la société française","m":"NAT","q":"Qu'est-ce que le SMIC ?","a":"Le salaire minimum interprofessionnel de croissance : le salaire horaire minimum légal en dessous duquel aucun salarié ne peut être payé."},{"i":238,"t":"Vivre dans la société française","m":"NAT","q":"Quelle est la première démarche à réaliser pour chercher un emploi ?","a":"S'inscrire à France Travail."},{"i":239,"t":"Vivre dans la société française","m":"NAT","q":"Quelle est la durée légale du temps de travail par semaine ?","a":"35 heures."},{"i":240,"t":"Vivre dans la société française","m":"NAT","q":"Qui peut demander un congé parental d'éducation ?","a":"Le père comme la mère, sous réserve d'une ancienneté suffisante dans l'entreprise."},{"i":241,"t":"Vivre dans la société française","m":"NAT","q":"Une personne étrangère, en situation régulière, peut créer son entreprise :","a":"Oui, dès lors que son titre de séjour l'autorise à exercer une activité."},{"i":242,"t":"Vivre dans la société française","m":"NAT","q":"Une femme peut-elle créer son entreprise ?","a":"Oui, librement et sans autorisation de qui que ce soit."},{"i":243,"t":"Vivre dans la société française","m":"NAT","q":"Quels sont les textes qui définissent les règles au travail ?","a":"Le code du travail, la convention collective de la branche, le contrat de travail et le règlement intérieur de l'entreprise."},{"i":244,"t":"Vivre dans la société française","m":"NAT","q":"Quelles sont les affaires traitées par le conseil de prud'hommes ?","a":"Les litiges individuels entre un salarié et son employeur liés au contrat de travail : licenciement contesté, salaires impayés, heures supplémentaires, harcèlement."},{"i":245,"t":"Vivre dans la société française","m":"NAT","q":"Qui a le droit de se syndiquer ?","a":"Tout salarié, quelle que soit sa nationalité, librement et sans avoir à en informer son employeur."},{"i":246,"t":"Vivre dans la société française","m":"NAT","q":"Est-il possible de licencier une femme enceinte ou en congé maternité, en raison de sa grossesse ?","a":"Non. C'est interdit et le licenciement est nul : la grossesse est un motif de discrimination prohibé."},{"i":247,"t":"Vivre dans la société française","m":"NAT","q":"L'instruction des enfants est obligatoire de :","a":"3 à 16 ans."},{"i":248,"t":"Vivre dans la société française","m":"NAT","q":"Des parents ne respectent pas l'obligation d'instruction pour leurs enfants. Quelle sanction maximale risquent-ils ?","a":"Jusqu'à six mois d'emprisonnement et 7 500 euros d'amende."},{"i":249,"t":"Vivre dans la société française","m":"NAT","q":"Quelle est la définition de l'autorité parentale ?","a":"L'ensemble des droits et des devoirs des parents pour protéger leur enfant : assurer sa sécurité, sa santé, sa moralité, son éducation et son entretien, dans le respect de sa personne."},{"i":250,"t":"Vivre dans la société française","m":"NAT","q":"Quel motif d'absence est accepté par l'école ?","a":"La maladie de l'enfant, une maladie contagieuse dans la famille, une réunion solennelle de famille, un empêchement de transport, l'absence temporaire des responsables. Des vacances hors calendrier scolaire ne sont pas un motif valable."},{"i":251,"t":"Vivre dans la société française","m":"NAT","q":"Jusqu'à quel âge l'école est-elle obligatoire ?","a":"Jusqu'à 16 ans. Une obligation de formation se prolonge ensuite jusqu'à 18 ans."},{"i":252,"t":"Vivre dans la société française","m":"NAT","q":"À quel âge commence l'instruction obligatoire des enfants ?","a":"3 ans."},{"i":253,"t":"Vivre dans la société française","m":"NAT","q":"Comment s'appellent les établissements scolaires que les élèves intègrent après l'école élémentaire ?","a":"Le collège."},{"i":254,"t":"Vivre dans la société française","m":"NAT","q":"En tant que parent d'élève, il est possible de :","a":"Être informé des résultats de son enfant, rencontrer les enseignants, élire des représentants et participer aux conseils d'école. Il est en revanche interdit de contester un enseignement pour un motif religieux."},{"i":255,"t":"Vivre dans la société française","m":"NAT","q":"Quelle instruction est prévue pour les enfants qui ne parlent pas français ?","a":"Ils sont scolarisés normalement, dans une classe ordinaire de leur âge, avec un dispositif de soutien linguistique renforcé pour apprendre le français."},{"i":256,"t":"Vivre dans la société française","m":"NAT","q":"S'agissant de l'accueil des enfants en situation de handicap à l'école, laquelle des propositions est vraie ?","a":"Tout enfant en situation de handicap a droit à être scolarisé en milieu ordinaire, avec les aménagements et l'accompagnement nécessaires."},{"i":257,"t":"Vivre dans la société française","m":"NAT","q":"Depuis le 1er juillet 2021, quelle est la durée du congé paternité ?","a":"25 jours calendaires, portés à 32 en cas de naissances multiples, auxquels s'ajoutent les 3 jours de congé de naissance, soit 28 jours au total."},{"i":258,"t":"Vivre dans la société française","m":"NAT","q":"Est-ce possible de punir physiquement ses enfants ?","a":"Non. L'autorité parentale s'exerce sans violence physique ni psychologique, depuis la loi du 10 juillet 2019."},{"i":259,"t":"Principes et valeurs de la République","m":"CR","q":"Parmi les propositions suivantes, laquelle constitue une participation citoyenne ?","a":"Voter, adhérer à une association ou à un syndicat, être bénévole, se présenter à une élection, participer à une réunion publique. Payer ses impôts est un devoir, pas une participation citoyenne au sens strict."},{"i":260,"t":"Principes et valeurs de la République","m":"CR","q":"Que garantit la liberté d'expression ?","a":"Le droit d'exprimer et de diffuser ses opinions, y compris critiques, dans les limites fixées par la loi : ni injure, ni diffamation, ni incitation à la haine ou à la violence."},{"i":261,"t":"Principes et valeurs de la République","m":"CR","q":"À quoi sert un titre de séjour ?","a":"Il autorise une personne étrangère à séjourner régulièrement en France pendant une durée déterminée. Ce n'est ni une pièce d'identité française ni une preuve de nationalité."},{"i":262,"t":"Principes et valeurs de la République","m":"CR","q":"La liberté de circulation permet à toute personne de :","a":"Se déplacer et s'installer librement où elle le souhaite sur le territoire, sans autorisation préalable."},{"i":263,"t":"Principes et valeurs de la République","m":"CR","q":"Sur quel site internet peut-on retrouver le symbole de la République française ?","a":"Sur les sites officiels de l'État, en .gouv.fr — notamment info.gouv.fr et elysee.fr."},{"i":264,"t":"Principes et valeurs de la République","m":"CR","q":"Complétez ces paroles de la Marseillaise : « Aux armes […] ! Formez vos bataillons »","a":"« Aux armes, citoyens ! »"},{"i":265,"t":"Principes et valeurs de la République","m":"CR","q":"Complétez les paroles de la Marseillaise : « Allons enfants de la patrie […] »","a":"« Le jour de gloire est arrivé »"},{"i":266,"t":"Principes et valeurs de la République","m":"CR","q":"En application de la liberté individuelle, quelle proposition est correcte ? Une personne peut :","a":"Choisir librement son conjoint, se marier ou non, divorcer, choisir sa religion ou n'en avoir aucune, choisir son métier, disposer de son corps."},{"i":267,"t":"Principes et valeurs de la République","m":"CR","q":"Concernant la pratique de la religion, quelle proposition est correcte ?","a":"Chacun est libre de pratiquer la religion de son choix, de ne pas en avoir ou d'en changer, dans le respect de la loi et de l'ordre public."},{"i":268,"t":"Principes et valeurs de la République","m":"CR","q":"En tant que parent, peut-on refuser que son enfant participe aux cours de sport à l'école car ils sont mixtes ?","a":"Non. Aucun motif religieux ou personnel ne permet de dispenser un enfant d'un enseignement obligatoire ; la mixité s'impose à l'école publique."},{"i":269,"t":"Principes et valeurs de la République","m":"CR","q":"Quelle est la devise de la France ?","a":"Liberté, Égalité, Fraternité."},{"i":270,"t":"Principes et valeurs de la République","m":"CR","q":"La répudiation de sa femme est :","a":"Interdite et sans effet en France. Seul le divorce prononcé par un juge met fin au mariage."},{"i":271,"t":"Principes et valeurs de la République","m":"CR","q":"Les impôts permettent de financer les dépenses publiques. Quelle proposition est correcte ?","a":"Ils financent les services publics dont bénéficie l'ensemble de la population : écoles, hôpitaux, routes, police, justice, défense. Toute personne résidant en France et y percevant des revenus doit les déclarer, quelle que soit sa nationalité."},{"i":272,"t":"Principes et valeurs de la République","m":"CR","q":"Peut-on brûler publiquement un drapeau français ?","a":"Non. L'outrage public au drapeau national, notamment lors d'une manifestation publique, est une infraction sanctionnée."},{"i":273,"t":"Principes et valeurs de la République","m":"CR","q":"Que fait l'État pour lutter contre les discriminations ?","a":"Il les interdit et les sanctionne pénalement, et il a créé des institutions et dispositifs de recours, au premier rang desquels le Défenseur des droits, que chacun peut saisir gratuitement."},{"i":274,"t":"Principes et valeurs de la République","m":"CR","q":"Que représente Marianne ?","a":"Elle est l'allégorie, la représentation symbolique de la République française et de ses valeurs. Ce n'est pas une personne réelle."},{"i":275,"t":"Principes et valeurs de la République","m":"CR","q":"Qu'est-ce que la liberté d'association ?","a":"Le droit de créer une association ou d'y adhérer librement, sans autorisation préalable de l'État (loi de 1901). Nul ne peut être contraint d'adhérer à une association."},{"i":276,"t":"Principes et valeurs de la République","m":"CR","q":"Qu'est-ce que la liberté ?","a":"Le droit de faire tout ce qui ne nuit pas à autrui. Elle est encadrée par la loi et s'arrête là où commence la liberté des autres."},{"i":277,"t":"Principes et valeurs de la République","m":"CR","q":"Qu'est-ce que la Marseillaise ?","a":"L'hymne national français, composé par Rouget de Lisle en 1792."},{"i":278,"t":"Principes et valeurs de la République","m":"CR","q":"Sur quel document peut-on voir Marianne ?","a":"Les timbres-poste, les pièces d'euro françaises, les documents officiels de l'administration."},{"i":279,"t":"Principes et valeurs de la République","m":"CR","q":"Un employeur refuse d'embaucher des femmes dans son entreprise. Que dit la loi ?","a":"C'est une discrimination interdite et pénalement sanctionnée. La candidate peut saisir le Défenseur des droits ou le conseil de prud'hommes."},{"i":280,"t":"Principes et valeurs de la République","m":"CR","q":"Une des valeurs de la devise républicaine est l'égalité. Qu'est-ce que cela signifie ?","a":"Que toutes les personnes ont les mêmes droits et les mêmes devoirs et sont traitées également par la loi, sans distinction d'origine, de sexe, de religion ou de handicap."},{"i":281,"t":"Principes et valeurs de la République","m":"CR","q":"Quelle est la place de la langue française dans la République ?","a":"Le français est la langue de la République, inscrite à l'article 2 de la Constitution. C'est la langue de l'administration, de la justice, de l'école et des actes officiels."},{"i":282,"t":"Principes et valeurs de la République","m":"CR","q":"Quels sont des symboles officiels de la République française ?","a":"Le drapeau tricolore, La Marseillaise et la devise « Liberté, Égalité, Fraternité », inscrits à l'article 2 de la Constitution."},{"i":283,"t":"Principes et valeurs de la République","m":"CR","q":"A-t-on le droit d'insulter publiquement quelqu'un parce qu'il est différent (handicap, apparence physique, sexe…) ?","a":"Non. L'injure publique en raison du handicap, du sexe, de l'origine, de la religion ou de l'orientation sexuelle est une infraction pénale aggravée."},{"i":284,"t":"Principes et valeurs de la République","m":"CR","q":"Le régime de la France est :","a":"Une république démocratique. Plus précisément un régime républicain semi-présidentiel, sous la Ve République."},{"i":285,"t":"Principes et valeurs de la République","m":"CR","q":"Pourquoi le principe de laïcité doit-il être respecté à l'école ?","a":"Pour protéger les élèves de toute pression religieuse ou idéologique, garantir l'égalité entre eux et leur permettre de développer leur esprit critique dans un cadre neutre."},{"i":286,"t":"Principes et valeurs de la République","m":"CR","q":"En quelle année la loi de séparation des Églises et de l'État a-t-elle été votée ?","a":"1905, le 9 décembre."},{"i":287,"t":"Principes et valeurs de la République","m":"CR","q":"Une personne a-t-elle le droit de ne pas croire en une religion ?","a":"Oui. La liberté de conscience inclut le droit de ne croire en aucune religion."},{"i":288,"t":"Principes et valeurs de la République","m":"CR","q":"Quel droit est garanti par la laïcité ?","a":"La liberté de conscience : croire, ne pas croire, changer de religion ou n'en avoir aucune, et pratiquer librement son culte dans le respect de la loi."},{"i":289,"t":"Principes et valeurs de la République","m":"CR","q":"À l'école publique, qui peut porter des signes religieux très visibles ?","a":"Personne parmi les élèves. La loi du 15 mars 2004 interdit les signes religieux ostensibles aux élèves des écoles, collèges et lycées publics, comme au personnel."},{"i":290,"t":"Principes et valeurs de la République","m":"CR","q":"Selon le principe de laïcité, que signifie la neutralité de l'État ?","a":"Que l'État ne reconnaît, ne salarie ni ne subventionne aucun culte, ne privilégie ni ne défavorise aucune religion, et que ses agents n'affichent aucune conviction dans l'exercice de leurs fonctions."},{"i":291,"t":"Principes et valeurs de la République","m":"CR","q":"Que peut faire un usager du service public dans une mairie ?","a":"Il peut porter un signe religieux et accomplir ses démarches normalement. Il ne peut pas exiger un traitement particulier fondé sur sa religion, ni refuser d'être reçu par un agent en raison de son sexe."},{"i":292,"t":"Principes et valeurs de la République","m":"CR","q":"Qui doit respecter le principe de neutralité religieuse dans une préfecture ?","a":"Tous les agents publics, quel que soit leur poste. Les usagers ne sont pas soumis à la neutralité."},{"i":293,"t":"Principes et valeurs de la République","m":"CR","q":"La laïcité impose-t-elle aux agents publics d'être neutres vis-à-vis des usagers ?","a":"Oui, de façon stricte et sans exception, pendant l'exercice de leurs fonctions."},{"i":294,"t":"Principes et valeurs de la République","m":"CR","q":"Que garantit le principe de laïcité ?","a":"La liberté de conscience, la neutralité de l'État et l'égalité de tous devant la loi quelles que soient les convictions."},{"i":295,"t":"Principes et valeurs de la République","m":"CR","q":"A-t-on le droit de changer de religion ?","a":"Oui, comme celui de ne plus en avoir. C'est une composante de la liberté de conscience."},{"i":296,"t":"Principes et valeurs de la République","m":"CR","q":"Que représente la laïcité ?","a":"Un principe qui garantit à chacun la liberté de croire ou de ne pas croire, et qui assure la neutralité de l'État. Ce n'est ni une religion, ni une opinion, ni l'interdiction des cultes."},{"i":297,"t":"Principes et valeurs de la République","m":"CR","q":"Qu'est-ce qui est interdit par la Charte de la laïcité à l'école ?","a":"Le port de signes religieux ostensibles par les élèves, le prosélytisme, et le refus d'un enseignement ou d'une activité pour un motif religieux."},{"i":298,"t":"Principes et valeurs de la République","m":"CR","q":"Que dit l'article 1er de la Constitution française ?","a":"Que la France est une République indivisible, laïque, démocratique et sociale, qui assure l'égalité devant la loi de tous les citoyens sans distinction d'origine, de race ou de religion, et respecte toutes les croyances."},{"i":299,"t":"Principes et valeurs de la République","m":"CSP","q":"À quoi correspond la date du 14 juillet ?","a":"À la fête nationale française. Elle commémore la prise de la Bastille (1789) et la Fête de la Fédération (1790)."},{"i":300,"t":"Principes et valeurs de la République","m":"CSP","q":"Quel est l'un des symboles de la République française ?","a":"Le drapeau tricolore, La Marseillaise ou la devise « Liberté, Égalité, Fraternité »."},{"i":301,"t":"Principes et valeurs de la République","m":"CSP","q":"Le principe d'égalité signifie que :","a":"Toutes les personnes ont les mêmes droits et les mêmes devoirs et sont traitées de la même façon par la loi."},{"i":302,"t":"Principes et valeurs de la République","m":"CSP","q":"« Liberté, égalité, fraternité », c'est :","a":"La devise de la République française."},{"i":303,"t":"Principes et valeurs de la République","m":"CSP","q":"A-t-on le droit d'insulter publiquement quelqu'un parce qu'il est différent (handicap, apparence physique, sexe…) ?","a":"Non. C'est une infraction pénale."},{"i":304,"t":"Principes et valeurs de la République","m":"CSP","q":"Certains métiers peuvent-ils être réservés aux hommes ?","a":"Non. Aucun métier ne peut être réservé à un sexe : ce serait une discrimination interdite."},{"i":305,"t":"Principes et valeurs de la République","m":"CSP","q":"De quand date la Constitution de la Ve République ?","a":"Du 4 octobre 1958."},{"i":306,"t":"Principes et valeurs de la République","m":"CSP","q":"Le régime de la France est :","a":"Une république démocratique."},{"i":307,"t":"Principes et valeurs de la République","m":"CSP","q":"Lequel de ces symboles représente officiellement la République française ?","a":"Le drapeau bleu, blanc, rouge."},{"i":308,"t":"Principes et valeurs de la République","m":"CSP","q":"Où peut-on voir la devise de la République ?","a":"Sur le fronton des mairies, des écoles et des bâtiments publics, ainsi que sur les pièces de monnaie et les documents officiels."},{"i":309,"t":"Principes et valeurs de la République","m":"CSP","q":"Quels sont des symboles officiels de la République française ?","a":"Le drapeau tricolore, La Marseillaise et la devise."},{"i":310,"t":"Principes et valeurs de la République","m":"CSP","q":"Qu'est-ce que l'égalité ?","a":"Le fait que tous aient les mêmes droits et les mêmes devoirs, sans distinction d'origine, de sexe, de religion ou de handicap."},{"i":311,"t":"Principes et valeurs de la République","m":"CSP","q":"Que signifie la liberté ?","a":"Le droit de faire tout ce qui ne nuit pas à autrui, dans les limites fixées par la loi."},{"i":312,"t":"Principes et valeurs de la République","m":"CSP","q":"Que signifie le mot « fraternité » dans la devise française ?","a":"La solidarité et l'entraide entre les membres de la société."},{"i":313,"t":"Principes et valeurs de la République","m":"CSP","q":"Quel animal est un symbole de la France ?","a":"Le coq, dit coq gaulois. C'est un emblème traditionnel, non officiel."},{"i":314,"t":"Principes et valeurs de la République","m":"CSP","q":"Quel est l'un des rôles des associations ?","a":"Défendre une cause, organiser des activités collectives (sport, culture, loisirs), aider les personnes en difficulté, créer du lien social."},{"i":315,"t":"Principes et valeurs de la République","m":"CSP","q":"Quel est le nom de l'hymne national ?","a":"La Marseillaise."},{"i":316,"t":"Principes et valeurs de la République","m":"CSP","q":"Quel symbole de la République française est tricolore ?","a":"Le drapeau : bleu, blanc, rouge."},{"i":317,"t":"Principes et valeurs de la République","m":"CSP","q":"Quelle est la date de la fête nationale française ?","a":"Le 14 juillet."},{"i":318,"t":"Principes et valeurs de la République","m":"CSP","q":"Quelle est la devise de la République française ?","a":"Liberté, Égalité, Fraternité."},{"i":319,"t":"Principes et valeurs de la République","m":"CSP","q":"Quelle est la langue officielle de la République française ?","a":"Le français."},{"i":320,"t":"Principes et valeurs de la République","m":"CSP","q":"Quelle est la place de la langue française dans la République ?","a":"C'est la langue de la République, inscrite à l'article 2 de la Constitution : langue de l'administration, de la justice, de l'école et des actes officiels."},{"i":321,"t":"Principes et valeurs de la République","m":"CSP","q":"Quelle liberté permet à chacun d'exprimer ses idées ?","a":"La liberté d'expression."},{"i":322,"t":"Principes et valeurs de la République","m":"CSP","q":"Quelle proposition est correcte ? La liberté d'expression :","a":"Elle permet d'exprimer ses opinions, y compris critiques, mais elle est limitée par la loi : ni injure, ni diffamation, ni incitation à la haine ou à la violence."},{"i":323,"t":"Principes et valeurs de la République","m":"CSP","q":"Quelles sont les couleurs du drapeau français ?","a":"Bleu, blanc, rouge."},{"i":324,"t":"Principes et valeurs de la République","m":"CSP","q":"Qu'est-ce que la Marseillaise ?","a":"L'hymne national de la France."},{"i":325,"t":"Principes et valeurs de la République","m":"CSP","q":"Qu'est-ce qui est traditionnellement organisé sur les Champs-Élysées le 14 juillet pour célébrer la fête nationale ?","a":"Un défilé militaire."},{"i":326,"t":"Principes et valeurs de la République","m":"CSP","q":"Qui est Marianne ?","a":"L'allégorie, la représentation symbolique de la République française. Ce n'est pas une personne réelle."},{"i":327,"t":"Principes et valeurs de la République","m":"CSP","q":"Une personne peut-elle changer librement de religion ?","a":"Oui, comme elle peut cesser de croire. C'est la liberté de conscience."},{"i":328,"t":"Principes et valeurs de la République","m":"CSP","q":"« La France est une République indivisible, …, démocratique et sociale ». Complétez cette phrase extraite de l'article 1er de la Constitution :","a":"« laïque »."},{"i":329,"t":"Principes et valeurs de la République","m":"CSP","q":"En quelle année la loi de séparation des Églises et de l'État a-t-elle été votée ?","a":"1905."},{"i":330,"t":"Principes et valeurs de la République","m":"CSP","q":"Que permet le principe de laïcité ?","a":"De croire, de ne pas croire o
