u de changer de religion, tout en garantissant la neutralité de l'État et l'égalité de tous devant la loi."},{"i":331,"t":"Principes et valeurs de la République","m":"CSP","q":"Quel droit est garanti par la laïcité ?","a":"La liberté de conscience."},{"i":332,"t":"Principes et valeurs de la République","m":"CSP","q":"Pourquoi le principe de laïcité doit-il être respecté à l'école ?","a":"Pour protéger les élèves de toute pression, garantir l'égalité entre eux et leur permettre de développer leur esprit critique."},{"i":333,"t":"Principes et valeurs de la République","m":"CSP","q":"Qu'est-ce que la laïcité ?","a":"Un principe qui garantit la liberté de conscience, impose la neutralité de l'État et assure l'égalité de tous quelles que soient leurs convictions. Ce n'est pas l'interdiction des religions."},{"i":334,"t":"Principes et valeurs de la République","m":"CSP","q":"Un enfant peut-il refuser d'aller à l'école pour une raison religieuse ?","a":"Non. L'instruction est obligatoire et aucun motif religieux ne dispense de la scolarité ni d'un enseignement."},{"i":335,"t":"Principes et valeurs de la République","m":"CSP","q":"Une personne a-t-elle le droit de ne pas croire en une religion ?","a":"Oui. La liberté de conscience inclut le droit de ne croire en aucune religion."},{"i":336,"t":"Système institutionnel et politique","m":"CR","q":"Qu'est-ce que l'État de droit ?","a":"Un système dans lequel tout le monde est soumis au droit, y compris l'État et les gouvernants. Il suppose une hiérarchie des normes, des juges indépendants et la possibilité de contester une décision de l'administration."},{"i":337,"t":"Système institutionnel et politique","m":"CR","q":"Le président de la République a commis un crime. Quelle proposition est correcte ?","a":"Il bénéficie d'une immunité pendant son mandat, mais il n'est pas impunissable : il peut être destitué par le Parlement réuni en Haute Cour, et il peut être poursuivi une fois son mandat terminé."},{"i":338,"t":"Système institutionnel et politique","m":"CR","q":"La loi est l'expression de :","a":"La volonté générale. La formule vient de l'article 6 de la Déclaration des droits de l'homme et du citoyen de 1789."},{"i":339,"t":"Système institutionnel et politique","m":"CR","q":"Quelle est la durée du mandat du conseil municipal et du maire ?","a":"6 ans."},{"i":340,"t":"Système institutionnel et politique","m":"CR","q":"Que garantit l'État de droit ?","a":"Le respect des droits et libertés de chacun, l'égalité devant la loi et la protection contre l'arbitraire du pouvoir."},{"i":341,"t":"Système institutionnel et politique","m":"CR","q":"Une personne peut-elle voter à la place d'une autre ?","a":"Non, sauf par procuration établie légalement, un électeur chargeant un autre électeur de voter en son nom. Voter à la place de quelqu'un sans procuration est un délit."},{"i":342,"t":"Système institutionnel et politique","m":"CR","q":"Est-ce que le vote est obligatoire ?","a":"Non, le vote n'est pas obligatoire en France. Il reste un devoir civique."},{"i":343,"t":"Système institutionnel et politique","m":"CR","q":"À la fin de son mandat, le président de la République peut-il décider de rester au pouvoir ?","a":"Non. À la fin de son mandat, il doit se représenter devant les électeurs, et il ne peut pas exercer plus de deux mandats consécutifs."},{"i":344,"t":"Système institutionnel et politique","m":"CR","q":"Qui dirige l'action du Gouvernement ?","a":"Le Premier ministre."},{"i":345,"t":"Système institutionnel et politique","m":"CR","q":"Qui nomme le Premier ministre ?","a":"Le président de la République."},{"i":346,"t":"Système institutionnel et politique","m":"CR","q":"Quelle est l'organisation administrative de la France ?","a":"Trois niveaux de collectivités territoriales — la commune, le département, la région — auxquels s'ajoute l'État, représenté localement par le préfet."},{"i":347,"t":"Système institutionnel et politique","m":"CR","q":"Qu'est-ce que le pouvoir législatif ? Le pouvoir :","a":"De faire et de voter la loi. Il est exercé par le Parlement."},{"i":348,"t":"Système institutionnel et politique","m":"CR","q":"Pourquoi séparer les trois pouvoirs dans une démocratie ?","a":"Pour éviter qu'une seule autorité concentre tous les pouvoirs et en abuse. Chaque pouvoir contrôle et limite les autres, ce qui protège les libertés."},{"i":349,"t":"Système institutionnel et politique","m":"CR","q":"Qui sanctionne l'auteur d'un vol ?","a":"Le juge, c'est-à-dire l'autorité judiciaire. Le vol relève du tribunal correctionnel. Ni la police ni le maire ne prononcent la sanction."},{"i":350,"t":"Système institutionnel et politique","m":"CR","q":"Quel est le rôle du gouvernement ?","a":"Conduire la politique de la nation, appliquer les lois, diriger l'administration. Il est responsable devant l'Assemblée nationale."},{"i":351,"t":"Système institutionnel et politique","m":"CR","q":"Que se passe-t-il si un ministre ne respecte pas la loi ?","a":"Il est jugé comme tout citoyen. Pour les actes commis dans l'exercice de ses fonctions, il relève de la Cour de justice de la République. Il n'est pas au-dessus de la loi."},{"i":352,"t":"Système institutionnel et politique","m":"CR","q":"Combien de députés composent l'Assemblée nationale ?","a":"577."},{"i":353,"t":"Système institutionnel et politique","m":"CR","q":"Qui peut voter aux élections en France ?","a":"Les citoyens français majeurs, jouissant de leurs droits civils et politiques et inscrits sur les listes électorales. Les citoyens des autres États de l'Union européenne résidant en France votent uniquement aux élections municipales et européennes."},{"i":354,"t":"Système institutionnel et politique","m":"CR","q":"Pour combien de temps sont élus les sénateurs ?","a":"6 ans, avec un renouvellement par moitié tous les 3 ans."},{"i":355,"t":"Système institutionnel et politique","m":"CR","q":"La séparation des pouvoirs est un principe fondamental. Quels sont les trois pouvoirs concernés ?","a":"Le pouvoir législatif, le pouvoir exécutif et le pouvoir judiciaire."},{"i":356,"t":"Système institutionnel et politique","m":"CR","q":"Est-ce que le président de la République a tous les pouvoirs ?","a":"Non. Ses pouvoirs sont définis et limités par la Constitution : il ne vote pas les lois et ne rend pas la justice."},{"i":357,"t":"Système institutionnel et politique","m":"CR","q":"Qui est le préfet ?","a":"Le représentant de l'État dans le département et dans la région. Il est nommé, non élu, et veille à l'application des lois et au maintien de l'ordre public."},{"i":358,"t":"Système institutionnel et politique","m":"CR","q":"Quelle condition est nécessaire pour voter aux élections ?","a":"Être inscrit sur les listes électorales, en plus d'être français, majeur et de jouir de ses droits civils et politiques."},{"i":359,"t":"Système institutionnel et politique","m":"CR","q":"Qui dirige la commune ?","a":"Le maire, élu par le conseil municipal, lui-même élu par les habitants."},{"i":360,"t":"Système institutionnel et politique","m":"CR","q":"Quel est le régime politique de la France aujourd'hui ?","a":"Une république démocratique, sous la Ve République : un régime semi-présidentiel."},{"i":361,"t":"Système institutionnel et politique","m":"CR","q":"Qu'est-ce que l'Hôtel de Matignon ?","a":"La résidence et le lieu de travail du Premier ministre."},{"i":362,"t":"Système institutionnel et politique","m":"CR","q":"Le Parlement est composé :","a":"De l'Assemblée nationale et du Sénat."},{"i":363,"t":"Système institutionnel et politique","m":"CR","q":"Quel est le rôle du président de la République ?","a":"Chef de l'État et chef des armées, garant de la Constitution, il nomme le Premier ministre et les ministres, préside le conseil des ministres, promulgue les lois et peut dissoudre l'Assemblée nationale."},{"i":364,"t":"Système institutionnel et politique","m":"CR","q":"Quel est le rôle du Premier ministre ?","a":"Il est le chef du Gouvernement : il dirige son action, assure l'exécution des lois et exerce le pouvoir réglementaire."},{"i":365,"t":"Système institutionnel et politique","m":"CR","q":"Qui est le chef du Gouvernement ?","a":"Le Premier ministre."},{"i":366,"t":"Système institutionnel et politique","m":"CR","q":"Combien y a-t-il de régions en France ?","a":"18 au total : 13 en métropole et 5 en outre-mer."},{"i":367,"t":"Système institutionnel et politique","m":"CR","q":"Quel est le rôle du Défenseur des droits ?","a":"C'est une autorité indépendante qui défend les droits et libertés face aux administrations et aux services publics, lutte contre les discriminations et protège les droits de l'enfant. On peut la saisir gratuitement."},{"i":368,"t":"Système institutionnel et politique","m":"CR","q":"Depuis quand l'euro est-elle la monnaie unique ?","a":"Depuis 1999 pour sa création ; les pièces et billets circulent en France depuis le 1er janvier 2002."},{"i":369,"t":"Système institutionnel et politique","m":"CR","q":"Quel est le rôle principal du département ?","a":"L'action sociale — RSA, aide à l'enfance, personnes âgées et handicapées — ainsi que les collèges et les routes départementales."},{"i":370,"t":"Système institutionnel et politique","m":"CR","q":"Quel est le rôle principal des communes ?","a":"Les services de proximité : état civil, écoles maternelles et élémentaires, urbanisme, voirie locale."},{"i":371,"t":"Système institutionnel et politique","m":"CR","q":"Combien de communes environ existe-t-il en France ?","a":"Environ 35 000. C'est de loin le pays d'Europe qui en compte le plus."},{"i":372,"t":"Système institutionnel et politique","m":"CR","q":"Quel traité concerne la construction de l'Union européenne ?","a":"Le traité de Maastricht, qui fonde l'Union européenne en 1992. Les traités de Paris (1951) et de Rome (1957) l'ont précédée, celui de Lisbonne (2007) l'a réformée."},{"i":373,"t":"Système institutionnel et politique","m":"CR","q":"Quel État a quitté l'Union européenne en 2020 ?","a":"Le Royaume-Uni, le 31 janvier 2020."},{"i":374,"t":"Système institutionnel et politique","m":"CR","q":"Quelle est la devise de l'Union européenne ?","a":"« Unie dans la diversité »."},{"i":375,"t":"Système institutionnel et politique","m":"CR","q":"Quel est l'hymne de l'Union européenne ?","a":"L'Ode à la joie, extraite de la Neuvième symphonie de Beethoven."},{"i":376,"t":"Système institutionnel et politique","m":"CR","q":"De quoi est composé le drapeau européen ?","a":"De douze étoiles dorées disposées en cercle sur fond bleu. Le nombre douze symbolise la perfection et l'unité, il ne correspond pas au nombre d'États membres."},{"i":377,"t":"Système institutionnel et politique","m":"CR","q":"De quelle couleur est le drapeau européen ?","a":"Bleu."},{"i":378,"t":"Système institutionnel et politique","m":"CR","q":"En quelle année le traité de Maastricht, qui marque la fondation de l'Union européenne, a-t-il été signé ?","a":"1992."},{"i":379,"t":"Système institutionnel et politique","m":"CR","q":"Où est le siège du Parlement européen ?","a":"Strasbourg."},{"i":380,"t":"Système institutionnel et politique","m":"CR","q":"Où est le siège de la Commission européenne ?","a":"Bruxelles."},{"i":381,"t":"Système institutionnel et politique","m":"CR","q":"Quel État n'est pas membre de l'Union européenne ?","a":"La Suisse, la Norvège, l'Islande, le Royaume-Uni ou la Turquie, selon les options proposées."},{"i":382,"t":"Système institutionnel et politique","m":"CR","q":"Quand célèbre-t-on la journée de l'Europe ?","a":"Le 9 mai, en référence à la déclaration Schuman du 9 mai 1950."},{"i":383,"t":"Système institutionnel et politique","m":"CR","q":"À quelle fréquence les élections européennes sont-elles organisées ?","a":"Tous les 5 ans."},{"i":384,"t":"Système institutionnel et politique","m":"CR","q":"Quelle condition est nécessaire pour voter aux élections européennes ?","a":"Être citoyen d'un État membre de l'Union européenne, avoir 18 ans et être inscrit sur les listes électorales."},{"i":385,"t":"Système institutionnel et politique","m":"CR","q":"Quel pays est un pays fondateur de l'Union européenne ?","a":"La France, l'Allemagne, l'Italie, la Belgique, les Pays-Bas ou le Luxembourg : ce sont les six fondateurs."},{"i":386,"t":"Système institutionnel et politique","m":"CSP","q":"Qui nomme le Premier ministre ?","a":"Le président de la République."},{"i":387,"t":"Système institutionnel et politique","m":"CSP","q":"Le Parlement est composé :","a":"De l'Assemblée nationale et du Sénat."},{"i":388,"t":"Système institutionnel et politique","m":"CSP","q":"Qu'est-ce que le pouvoir exécutif ? Le pouvoir :","a":"D'appliquer la loi et de gouverner."},{"i":389,"t":"Système institutionnel et politique","m":"CSP","q":"Les dirigeants sont élus par les citoyens dans :","a":"Une démocratie."},{"i":390,"t":"Système institutionnel et politique","m":"CSP","q":"A-t-on le droit de ne pas respecter une loi ?","a":"Non. La loi s'impose à tous, et ne pas la respecter expose à une sanction."},{"i":391,"t":"Système institutionnel et politique","m":"CSP","q":"Qui doit respecter la loi ?","a":"Tout le monde, sans exception : les habitants quelle que soit leur nationalité, comme les responsables politiques."},{"i":392,"t":"Système institutionnel et politique","m":"CSP","q":"Quel est le rôle de l'autorité judiciaire ?","a":"Faire respecter la loi, trancher les litiges et sanctionner ceux qui l'enfreignent. Elle est indépendante."},{"i":393,"t":"Système institutionnel et politique","m":"CSP","q":"Quel pouvoir détient un juge ? Le pouvoir :","a":"Le pouvoir judiciaire."},{"i":394,"t":"Système institutionnel et politique","m":"CSP","q":"L'autorité judiciaire est exercée par :","a":"Les juges et les tribunaux, c'est-à-dire les magistrats."},{"i":395,"t":"Système institutionnel et politique","m":"CSP","q":"Que se passe-t-il si un ministre ne respecte pas la loi ?","a":"Il est jugé comme tout citoyen : il n'est pas au-dessus de la loi."},{"i":396,"t":"Système institutionnel et politique","m":"CSP","q":"Qui est élu lors des élections législatives ?","a":"Les députés."},{"i":397,"t":"Système institutionnel et politique","m":"CSP","q":"Combien de députés composent l'Assemblée nationale ?","a":"577."},{"i":398,"t":"Système institutionnel et politique","m":"CSP","q":"Quand sont élus les sénateurs ?","a":"Tous les 3 ans, par moitié. Chaque sénateur est élu pour 6 ans."},{"i":399,"t":"Système institutionnel et politique","m":"CSP","q":"Qui est élu lors des élections municipales ?","a":"Les conseillers municipaux, qui élisent ensuite le maire parmi eux."},{"i":400,"t":"Système institutionnel et politique","m":"CSP","q":"Qui est élu lors des élections présidentielles ?","a":"Le président de la République."},{"i":401,"t":"Système institutionnel et politique","m":"CSP","q":"À partir de quel âge a-t-on le droit de voter ?","a":"18 ans."},{"i":402,"t":"Système institutionnel et politique","m":"CSP","q":"Pour combien de temps est élu le président de la République française ?","a":"5 ans."},{"i":403,"t":"Système institutionnel et politique","m":"CSP","q":"Pour combien de temps sont élus les députés ?","a":"5 ans."},{"i":404,"t":"Système institutionnel et politique","m":"CSP","q":"Pour combien de temps sont élus les sénateurs ?","a":"6 ans."},{"i":405,"t":"Système institutionnel et politique","m":"CSP","q":"Qui possède le pouvoir exécutif ?","a":"Le président de la République et le Gouvernement."},{"i":406,"t":"Système institutionnel et politique","m":"CSP","q":"Quelle condition est nécessaire pour voter aux élections ?","a":"Être inscrit sur les listes électorales."},{"i":407,"t":"Système institutionnel et politique","m":"CSP","q":"Qui peut voter aux élections en France ?","a":"Les citoyens français majeurs inscrits sur les listes électorales et jouissant de leurs droits civils et politiques."},{"i":408,"t":"Système institutionnel et politique","m":"CSP","q":"Que signifie « suffrage universel » ?","a":"Que tous les citoyens majeurs ont le droit de vote, sans condition de fortune, de sexe, d'origine ou d'instruction."},{"i":409,"t":"Système institutionnel et politique","m":"CSP","q":"Concernant les partis politiques, quelle proposition est correcte ?","a":"Il en existe plusieurs, aux idées différentes : ils se forment et agissent librement, et l'adhésion est facultative."},{"i":410,"t":"Système institutionnel et politique","m":"CSP","q":"Quel est le rôle des députés ?","a":"Voter la loi, voter le budget et contrôler l'action du Gouvernement."},{"i":411,"t":"Système institutionnel et politique","m":"CSP","q":"La séparation des pouvoirs est un principe fondamental. Quels sont les trois pouvoirs concernés ?","a":"Le pouvoir législatif, le pouvoir exécutif et le pouvoir judiciaire."},{"i":412,"t":"Système institutionnel et politique","m":"CSP","q":"Qui possède le pouvoir législatif ?","a":"Le Parlement, c'est-à-dire l'Assemblée nationale et le Sénat."},{"i":413,"t":"Système institutionnel et politique","m":"CSP","q":"Qui sanctionne l'auteur d'un vol ?","a":"Le juge."},{"i":414,"t":"Système institutionnel et politique","m":"CSP","q":"Qui élit les députés ?","a":"Les citoyens, au suffrage universel direct."},{"i":415,"t":"Système institutionnel et politique","m":"CSP","q":"Qui vote les lois ?","a":"Le Parlement."},{"i":416,"t":"Système institutionnel et politique","m":"CSP","q":"Qui réside au palais de l'Élysée ?","a":"Le président de la République."},{"i":417,"t":"Système institutionnel et politique","m":"CSP","q":"Combien y a-t-il de départements en France ?","a":"101 : 96 en métropole et 5 en outre-mer."},{"i":418,"t":"Système institutionnel et politique","m":"CSP","q":"Qui représente l'État dans un département ?","a":"Le préfet."},{"i":419,"t":"Système institutionnel et politique","m":"CSP","q":"Qui dirige la commune ?","a":"Le maire."},{"i":420,"t":"Système institutionnel et politique","m":"CSP","q":"Est-ce que le président de la République a tous les pouvoirs ?","a":"Non. Ses pouvoirs sont limités par la Constitution."},{"i":421,"t":"Système institutionnel et politique","m":"CSP","q":"Qui est le préfet ?","a":"Le représentant de l'État dans le département, nommé et non élu."},{"i":422,"t":"Système institutionnel et politique","m":"CSP","q":"Quel est le rôle du Parlement ?","a":"Voter les lois et le budget, et contrôler le Gouvernement."},{"i":423,"t":"Système institutionnel et politique","m":"CSP","q":"Quel est le régime politique de la France aujourd'hui ?","a":"Une république démocratique."},{"i":424,"t":"Système institutionnel et politique","m":"CSP","q":"Combien d'États font partie de l'Union européenne au 1er janvier 2025 ?","a":"27."},{"i":425,"t":"Système institutionnel et politique","m":"CSP","q":"Quel État n'est pas membre de l'Union européenne ?","a":"La Suisse, la Norvège, l'Islande, le Royaume-Uni ou la Turquie, selon les options proposées."},{"i":426,"t":"Système institutionnel et politique","m":"CSP","q":"Quelle condition est nécessaire pour voter aux élections européennes ?","a":"Être citoyen d'un État membre de l'Union européenne, avoir 18 ans et être inscrit sur les listes électorales."},{"i":427,"t":"Système institutionnel et politique","m":"CSP","q":"À quelle fréquence les élections européennes sont-elles organisées ?","a":"Tous les 5 ans."},{"i":428,"t":"Système institutionnel et politique","m":"CSP","q":"Quel pays est un pays fondateur de l'Union européenne ?","a":"La France, l'Allemagne, l'Italie, la Belgique, les Pays-Bas ou le Luxembourg."},{"i":429,"t":"Système institutionnel et politique","m":"CSP","q":"Quelle est la monnaie utilisée en France ?","a":"L'euro."},{"i":430,"t":"Système institutionnel et politique","m":"CSP","q":"Qui élit les députés européens ?","a":"Les citoyens de l'Union européenne, au suffrage universel direct."},{"i":431,"t":"Système institutionnel et politique","m":"CSP","q":"Quand célèbre-t-on la journée de l'Europe ?","a":"Le 9 mai."},{"i":432,"t":"Droits et devoirs","m":"CR","q":"À quelle liberté la PMA fait-elle référence ?","a":"Au droit de disposer de son corps et à la liberté de fonder une famille."},{"i":433,"t":"Droits et devoirs","m":"CR","q":"Au nom de quoi l'État justifie-t-il la restriction des droits ?","a":"De l'ordre public — sécurité, tranquillité, salubrité —, de la protection des droits d'autrui, de la santé publique et de la protection des mineurs. La restriction doit être prévue par la loi et proportionnée."},{"i":434,"t":"Droits et devoirs","m":"CR","q":"Concernant le droit de se marier, quelle proposition est correcte ?","a":"Le mariage suppose le consentement libre des deux personnes, majeures, et il est célébré en mairie. Deux personnes de même sexe peuvent se marier. Le mariage forcé et la polygamie sont interdits."},{"i":435,"t":"Droits et devoirs","m":"CR","q":"Est-il toujours possible de divorcer ?","a":"Oui. Chacun peut demander le divorce, et personne ne peut être contraint de rester marié."},{"i":436,"t":"Droits et devoirs","m":"CR","q":"La peine de mort est :","a":"Abolie depuis 1981, et son interdiction est inscrite dans la Constitution depuis 2007."},{"i":437,"t":"Droits et devoirs","m":"CR","q":"Laquelle de ces citations est inscrite dans la Déclaration des droits de l'homme et du citoyen de 1789 ?","a":"« Les hommes naissent et demeurent libres et égaux en droits », premier article de la Déclaration."},{"i":438,"t":"Droits et devoirs","m":"CR","q":"Le recours à l'avortement est-il autorisé ?","a":"Oui, légal depuis la loi Veil de 1975, dans le délai de quatorze semaines de grossesse. Depuis 2024, la liberté d'y recourir est garantie par la Constitution."},{"i":439,"t":"Droits et devoirs","m":"CR","q":"Que contient la Constitution ?","a":"L'organisation des pouvoirs publics — Président, Gouvernement, Parlement, justice — et les droits et libertés fondamentaux, ainsi que les principes de la République."},{"i":440,"t":"Droits et devoirs","m":"CR","q":"Que garantit la liberté de la presse ?","a":"Le droit d'informer et de publier sans censure ni autorisation préalable de l'État. Elle est limitée par la diffamation, l'injure, l'atteinte à la vie privée et l'incitation à la haine."},{"i":441,"t":"Droits et devoirs","m":"CR","q":"Que prévoit la Charte de l'environnement ?","a":"Le droit de chacun de vivre dans un environnement équilibré et respectueux de la santé, le devoir de le préserver et le principe de précaution."},{"i":442,"t":"Droits et devoirs","m":"CR","q":"Que signifie la dignité humaine ?","a":"Que toute personne mérite le respect du seul fait qu'elle est un être humain. On ne peut ni y renoncer ni traiter quelqu'un comme un objet."},{"i":443,"t":"Droits et devoirs","m":"CR","q":"Que signifie le droit de manifester ?","a":"Le droit d'exprimer collectivement une opinion sur la voie publique, de façon pacifique. Une manifestation doit être déclarée à l'avance en préfecture ou en mairie."},{"i":444,"t":"Droits et devoirs","m":"CR","q":"Que signifie PMA ?","a":"Procréation médicalement assistée, aussi appelée assistance médicale à la procréation."},{"i":445,"t":"Droits et devoirs","m":"CR","q":"Quel texte est le plus difficile à modifier ?","a":"La Constitution. Sa révision exige un vote identique des deux chambres, puis un référendum ou l'approbation des trois cinquièmes du Congrès."},{"i":446,"t":"Droits et devoirs","m":"CR","q":"Quelle liberté permet à une personne de croire en la religion de son choix ?","a":"La liberté de conscience, qui est aussi la liberté de religion."},{"i":447,"t":"Droits et devoirs","m":"CR","q":"Qu'est-ce que le droit de grève ?","a":"Le droit de cesser collectivement le travail pour défendre des revendications professionnelles. C'est un droit de valeur constitutionnelle."},{"i":448,"t":"Droits et devoirs","m":"CR","q":"Qu'est-ce que la Constitution ?","a":"Le texte suprême de l'État : il organise les pouvoirs publics et garantit les droits et libertés. Toutes les autres normes doivent lui être conformes."},{"i":449,"t":"Droits et devoirs","m":"CR","q":"Qui peut demander à avorter ?","a":"Toute femme enceinte qui ne souhaite pas poursuivre sa grossesse, y compris une mineure, sans autorisation parentale. Elle seule décide."},{"i":450,"t":"Droits et devoirs","m":"CR","q":"Une femme majeure de nationalité française a-t-elle le droit de voter aux élections ?","a":"Oui. Les femmes disposent du droit de vote depuis 1944 et l'exercent dans les mêmes conditions que les hommes."},{"i":451,"t":"Droits et devoirs","m":"CR","q":"Concernant l'utilisation des réseaux sociaux, quelle proposition est correcte ?","a":"La liberté d'expression s'y applique avec exactement les mêmes limites qu'ailleurs. L'injure, le harcèlement, la provocation à la haine et la diffusion d'images d'une personne sans son accord y sont des infractions."},{"i":452,"t":"Droits et devoirs","m":"CR","q":"Jeter un mégot par terre est :","a":"Interdit et sanctionné par une amende : c'est une contravention."},{"i":453,"t":"Droits et devoirs","m":"CR","q":"L'État peut-il limiter les droits et libertés ?","a":"Oui, mais seulement par la loi, pour un motif légitime et de manière proportionnée. Il ne peut pas les supprimer arbitrairement."},{"i":454,"t":"Droits et devoirs","m":"CR","q":"Parmi ces actions, laquelle permet d'adopter une attitude respectueuse de l'environnement ?","a":"Trier ses déchets, les déposer en déchèterie, économiser l'eau et l'énergie, utiliser les transports en commun, réduire ses emballages."},{"i":455,"t":"Droits et devoirs","m":"CR","q":"Quelle proposition constitue une obligation ?","a":"Respecter la loi, payer ses impôts, faire instruire ses enfants, assurer son véhicule, porter assistance à une personne en danger."},{"i":456,"t":"Droits et devoirs","m":"CR","q":"Pour quel motif peut-on limiter la liberté d'expression ?","a":"L'injure, la diffamation, la provocation à la haine, à la discrimination ou à la violence, l'apologie du terrorisme, l'atteinte à la vie privée."},{"i":457,"t":"Droits et devoirs","m":"CR","q":"Pourquoi doit-on trier ses déchets ?","a":"Pour permettre le recyclage, économiser les ressources naturelles et réduire la pollution. Le tri est obligatoire."},{"i":458,"t":"Droits et devoirs","m":"CR","q":"Que doit faire une victime de violences ?","a":"En parler et ne pas rester seule : appeler le 17 ou le 3919, consulter un médecin pour faire constater les faits, et porter plainte dans n'importe quel commissariat ou brigade de gendarmerie."},{"i":459,"t":"Droits et devoirs","m":"CR","q":"Que doit-on faire face aux ordres des policiers ou gendarmes ?","a":"Obéir et présenter ses papiers si on les demande. Si l'on estime le contrôle abusif, on le conteste ensuite par les voies de droit, jamais sur place."},{"i":460,"t":"Droits et devoirs","m":"CR","q":"Quel est le rôle de la police ?","a":"Protéger les personnes et les biens, faire respecter la loi, maintenir l'ordre public, constater les infractions et en rechercher les auteurs. Elle ne prononce pas la sanction : c'est le juge qui juge."},{"i":461,"t":"Droits et devoirs","m":"CR","q":"Quel est un exemple d'assistance à personne en danger ?","a":"Appeler les secours, le 15, le 18 ou le 112, et porter secours dans la mesure du possible sans se mettre en danger."},{"i":462,"t":"Droits et devoirs","m":"CR","q":"Quel exemple illustre une limitation de liberté pour protéger l'intérêt général ?","a":"Les limitations de vitesse, l'obligation du port du casque ou de la ceinture, l'interdiction de fumer dans les lieux publics fermés, les vaccinations obligatoires."},{"i":463,"t":"Droits et devoirs","m":"CR","q":"Quelle est l'attitude à avoir lorsqu'on est témoin de violences ?","a":"Alerter les secours en appelant le 17 ou le 112, ne pas se mettre en danger, puis témoigner. Ne rien faire est un délit de non-assistance à personne en danger."},{"i":464,"t":"Droits et devoirs","m":"CR","q":"Quelle est l'infraction la plus grave ?","a":"Le crime."},{"i":465,"t":"Droits et devoirs","m":"CR","q":"Quelle obligation concerne toutes les personnes résidant en France quelle que soit leur nationalité ?","a":"Respecter la loi et payer ses impôts. Ces obligations ne dépendent pas de la nationalité."},{"i":466,"t":"Droits et devoirs","m":"CR","q":"Quelle proposition représente un exemple de crime ?","a":"Le meurtre, le viol, le vol à main armée, la mutilation sexuelle."},{"i":467,"t":"Droits et devoirs","m":"CR","q":"Quelle proposition représente un exemple de délit ?","a":"Le vol, l'escroquerie, la discrimination, le travail dissimulé, la conduite en état d'ivresse."},{"i":468,"t":"Droits et devoirs","m":"CR","q":"Qui veille au maintien de l'ordre public ?","a":"La police nationale et la gendarmerie nationale, sous l'autorité de l'État, le préfet en étant responsable dans le département."},{"i":469,"t":"Droits et devoirs","m":"CR","q":"S'agissant des déchets, quelle proposition est correcte ?","a":"Ils doivent être triés et déposés dans les conteneurs ou en déchèterie. Les abandonner sur la voie publique est sanctionné."},{"i":470,"t":"Droits et devoirs","m":"CSP","q":"Comment s'appelle la Constitution actuelle de la France ?","a":"La Constitution de la Ve République, du 4 octobre 1958."},{"i":471,"t":"Droits et devoirs","m":"CSP","q":"Comment s'appelle le texte qui énonce les droits et devoirs des personnes résidant en France ?","a":"La Déclaration des droits de l'homme et du citoyen de 1789, intégrée à la Constitution."},{"i":472,"t":"Droits et devoirs","m":"CSP","q":"Concernant les droits individuels, quelle proposition est correcte ?","a":"Ils appartiennent à toute personne, sans distinction, et chacun en bénéficie également. Ils sont encadrés par la loi."},{"i":473,"t":"Droits et devoirs","m":"CSP","q":"De quelle année date la Déclaration des droits de l'homme et du citoyen ?","a":"1789."},{"i":474,"t":"Droits et devoirs","m":"CSP","q":"Lequel de ces droits est un droit fondamental ?","a":"Le droit à la vie, à la sûreté, à l'éducation, à la santé, ou la liberté d'expression."},{"i":475,"t":"Droits et devoirs","m":"CSP","q":"Parmi ces textes, lequel garantit les droits et libertés en France ?","a":"La Déclaration des droits de l'homme et du citoyen de 1789 et la Constitution."},{"i":476,"t":"Droits et devoirs","m":"CSP","q":"Qu'est-ce que la liberté d'expression ?","a":"Le droit de dire, d'écrire et de publier ses opinions, dans les limites fixées par la loi."},{"i":477,"t":"Droits et devoirs","m":"CSP","q":"Quel droit permet à une personne de se défendre devant la justice ?","a":"Les droits de la défense : le droit à un procès équitable et le droit d'être assisté par un avocat."},{"i":478,"t":"Droits et devoirs","m":"CSP","q":"Quel est le texte fondateur établissant en France les droits et les devoirs de chaque citoyen ?","a":"La Déclaration des droits de l'homme et du citoyen de 1789."},{"i":479,"t":"Droits et devoirs","m":"CSP","q":"Quel texte a été adopté pendant la Révolution française ?","a":"La Déclaration des droits de l'homme et du citoyen, adoptée le 26 août 1789."},{"i":480,"t":"Droits et devoirs","m":"CSP","q":"Quelle liberté permet à une personne de ne pas avoir de religion ?","a":"La liberté de conscience."},{"i":481,"t":"Droits et devoirs","m":"CSP","q":"Une femme peut avorter :","a":"Si elle le souhaite, dans le délai légal de quatorze semaines de grossesse. Elle seule décide."},{"i":482,"t":"Droits et devoirs","m":"CSP","q":"Est-il toujours possible de divorcer ?","a":"Oui."},{"i":483,"t":"Droits et devoirs","m":"CSP","q":"La peine de mort est :","a":"Abolie depuis 1981."},{"i":484,"t":"Droits et devoirs","m":"CSP","q":"Concernant les limites aux libertés individuelles, quelle proposition est correcte ?","a":"Elles sont fixées par la loi, pour protéger l'ordre public et les droits des autres. Une liberté s'arrête là où commence celle d'autrui."},{"i":485,"t":"Droits et devoirs","m":"CSP","q":"En France, est-ce légal d'être marié à plusieurs personnes en même temps ?","a":"Non. La polygamie est interdite et sanctionnée."},{"i":486,"t":"Droits et devoirs","m":"CSP","q":"Faut-il réduire ses déchets ?","a":"Oui. Réduire ses déchets vient même avant le tri."},{"i":487,"t":"Droits et devoirs","m":"CSP","q":"Jeter une bouteille dans la rue est :","a":"Interdit et sanctionné par une amende."},{"i":488,"t":"Droits et devoirs","m":"CSP","q":"Pourquoi les libertés individuelles peuvent-elles être limitées ?","a":"Pour protéger l'ordre public, la sécurité, la santé publique et les droits des autres."},{"i":489,"t":"Droits et devoirs","m":"CSP","q":"Que doit faire une personne en cas d'accident ?","a":"Protéger les lieux, alerter les secours en appelant le 15, le 18 ou le 112, et secourir sans se mettre en danger. Quitter les lieux est un délit de fuite."},{"i":490,"t":"Droits et devoirs","m":"CSP","q":"Que permet la citoyenneté française ?","a":"De voter, d'être candidat à une élection, d'accéder aux emplois de la fonction publique et de bénéficier de la protection consulaire à l'étranger."},{"i":491,"t":"Droits et devoirs","m":"CSP","q":"Que risque une personne qui ne respecte pas la loi ?","a":"Une sanction pénale : amende, peine de prison, peines complémentaires, selon la gravité de l'infraction."},{"i":492,"t":"Droits et devoirs","m":"CSP","q":"Quel est le rôle de la gendarmerie ?","a":"Les mêmes missions que la police — protéger, faire respecter la loi, maintenir l'ordre, constater les infractions — mais dans les zones rurales et périurbaines. Elle a un statut militaire."},{"i":493,"t":"Droits et devoirs","m":"CSP","q":"Quel est le rôle de la police ?","a":"Protéger les personnes et les biens, faire respecter la loi, maintenir l'ordre public et constater les infractions, dans les villes."},{"i":494,"t":"Droits et devoirs","m":"CSP","q":"Qu'est-ce qu'une infraction ?","a":"Un comportement interdit par la loi et sanctionné pénalement. Il en existe trois niveaux : contravention, délit, crime."},{"i":495,"t":"Droits et devoirs","m":"CSP","q":"Comment peut-on réduire ses déchets ?","a":"Acheter en vrac et sans emballage superflu, éviter les produits jetables, réparer et réutiliser, composter les déchets alimentaires."},{"i":496,"t":"Droits et devoirs","m":"CSP","q":"Déposer une machine à laver cassée sur le trottoir est :","a":"Interdit : c'est un dépôt sauvage, sanctionné par une amende. Il faut l'apporter en déchèterie ou utiliser le service d'enlèvement des encombrants."},{"i":497,"t":"Droits et devoirs","m":"CSP","q":"En quoi consiste la traite des êtres humains ?","a":"À recruter, transporter ou héberger une personne en vue de l'exploiter : travail forcé, mendicité, prostitution, prélèvement d'organes. C'est sévèrement puni."},{"i":498,"t":"Droits et devoirs","m":"CSP","q":"Que doit faire une victime de violences ?","a":"Ne pas rester seule : appeler le 17 ou le 3919, faire constater les faits par un médecin et porter plainte au commissariat ou à la gendarmerie."},{"i":499,"t":"Droits et devoirs","m":"CSP","q":"Quelle est l'infraction la plus grave ?","a":"Le crime."},{"i":500,"t":"Histoire, géographie et culture","m":"CR","q":"Quel était le surnom de Louis XIV ?","a":"Le Roi-Soleil."},{"i":501,"t":"Histoire, géographie et culture","m":"CR","q":"Quel roi de France a été exécuté pendant la Révolution française ?","a":"Louis XVI, exécuté en 1793."},{"i":502,"t":"Histoire, géographie et culture","m":"CR","q":"En quelle année Napoléon Ier est-il devenu empereur ?","a":"1804."},{"i":503,"t":"Histoire, géographie et culture","m":"CR","q":"Lequel de ces personnages a un lien avec la République française ?","a":"Marianne, Charles de Gaulle, Jules Ferry, Victor Schoelcher ou Simone Veil, selon les options."},{"i":504,"t":"Histoire, géographie et culture","m":"CR","q":"De quand date l'appel à la résistance du général de Gaulle ?","a":"Du 18 juin 1940, lancé depuis Londres à la radio."},{"i":505,"t":"Histoire, géographie et culture","m":"CR","q":"Pourquoi la Shoah est-elle étudiée à l'école ?","a":"Pour transmettre la mémoire des victimes, comprendre où mènent le racisme et l'antisémitisme, et empêcher que cela se reproduise."},{"i":506,"t":"Histoire, géographie et culture","m":"CR","q":"Quel pays a été colonisé par la France ?","a":"L'Algérie, le Maroc, la Tunisie, le Sénégal, le Mali, la Côte d'Ivoire, Madagascar ou le Vietnam, selon les options."},{"i":507,"t":"Histoire, géographie et culture","m":"CR","q":"Depuis quand les Français élisent-ils le président de la République au suffrage universel direct ?","a":"Depuis la réforme de 1962, appliquée pour la première fois à l'élection de 1965."},{"i":508,"t":"Histoire, géographie et culture","m":"CR","q":"Quelle est la première étape de la construction européenne en 1951 ?","a":"La Communauté européenne du charbon et de l'acier, la CECA, créée par le traité de Paris."},{"i":509,"t":"Histoire, géographie et culture","m":"CR","q":"Durant le mandat de quel président la peine de mort a-t-elle été abolie ?","a":"François Mitterrand, en 1981. La loi a été portée par Robert Badinter."},{"i":510,"t":"Histoire, géographie et culture","m":"CR","q":"Quel régime politique a été mis en place pendant la Révolution française en 1792 ?","a":"La République : c'est la Ire République, proclamée en 1792."},{"i":511,"t":"Histoire, géographie et culture","m":"CR","q":"Qui était une figure de la Résistance française pendant la Seconde Guerre mondiale ?","a":"Jean Moulin, Lucie Aubrac, Charles de Gaulle ou Joséphine Baker, selon les options."},{"i":512,"t":"Histoire, géographie et culture","m":"CR","q":"En 1944, qu'est-ce qui a changé pour les femmes ?","a":"Elles obtiennent le droit de vote et le droit d'être élues."},{"i":513,"t":"Histoire, géographie et culture","m":"CR","q":"Quelle organisation internationale a été créée en 1945 après la Seconde Guerre mondiale ?","a":"L'Organisation des Nations unies, l'ONU."},{"i":514,"t":"Histoire, géographie et culture","m":"CR","q":"Quelle peine a été supprimée en 1981 ?","a":"La peine de mort."},{"i":515,"t":"Histoire, géographie et culture","m":"CR","q":"En quelle année l'euro est-elle devenue la monnaie utilisée en France ?","a":"2002, pour la mise en circulation des pièces et des billets. L'euro existe depuis 1999."},{"i":516,"t":"Histoire, géographie et culture","m":"CR","q":"En quelle année a commencé la Première Guerre mondiale ?","a":"1914."},{"i":517,"t":"Histoire, géographie et culture","m":"CR","q":"Où a eu lieu le débarquement en 1944 ?","a":"En Normandie, le 6 juin 1944. Un second débarquement a eu lieu en Provence en août 1944."},{"i":518,"t":"Histoire, géographie et culture","m":"CR","q":"Quel continent a été le plus concerné par la décolonisation française après la Seconde Guerre mondiale ?","a":"L'Afrique."},{"i":519,"t":"Histoire, géographie et culture","m":"CR","q":"Que fête-t-on le 8 mai ?","a":"La victoire des Alliés et la fin de la Seconde Guerre mondiale en Europe, en 1945."},{"i":520,"t":"Histoire, géographie et culture","m":"CR","q":"Quelle mer ou océan borde la France métropolitaine ?","a":"La mer du Nord, la Manche, l'océan Atlantique et la mer Méditerranée."},{"i":521,"t":"Histoire, géographie et culture","m":"CR","q":"Quel pays a une frontière terrestre avec la France métropolitaine ?","a":"La Belgique, le Luxembourg, l'Allemagne, la Suisse, l'Italie, l'Espagne, Andorre ou Monaco."},{"i":522,"t":"Histoire, géographie et culture","m":"CR","q":"Quelle ville française est un port maritime ?","a":"Marseille, Le Havre, Dunkerque, Nantes-Saint-Nazaire, Calais ou Bordeaux."},{"i":523,"t":"Histoire, géographie et culture","m":"CR","q":"Quelle mer se situe entre la France et l'Angleterre ?","a":"La Manche."},{"i":524,"t":"Histoire, géographie et culture","m":"CR","q":"Qu'est-ce que la France d'outre-mer ?","a":"L'ensemble des territoires français situés hors d'Europe, dans les océans Atlantique, Indien et Pacifique. Ils font partie de la République française."},{"i":525,"t":"Histoire, géographie et culture","m":"CR","q":"Quelle chaîne de montagnes est située entre la France et l'Espagne ?","a":"Les Pyrénées."},{"i":526,"t":"Histoire, géographie et culture","m":"CR","q":"Quelle île française se trouve dans l'océan Indien ?","a":"La Réunion. Mayotte s'y trouve également."},{"i":527,"t":"Histoire, géographie et culture","m":"CR","q":"Quelle est la population approximative de la France en 2025 ?","a":"Environ 68 millions d'habitants."},{"i":528,"t":"Histoire, géographie et culture","m":"CR","q":"Quel fleuve traverse Paris ?","a":"La Seine."},{"i":529,"t":"Histoire, géographie et culture","m":"CR","q":"Lequel de ces pays partage des frontières terrestres avec la France ?","a":"La Belgique, le Luxembourg, l'Allemagne, la Suisse, l'Italie, l'Espagne, Andorre ou Monaco."},{"i":530,"t":"Histoire, géographie et culture","m":"CR","q":"Quel pays a une frontière avec la France métropolitaine au nord-est ?","a":"La Belgique, le Luxembourg ou l'Allemagne."},{"i":531,"t":"Histoire, géographie et culture","m":"CR","q":"Où se trouvent les principales activités économiques en France ?","a":"Dans les grandes aires urbaines, et en premier lieu en Île-de-France."},{"i":532,"t":"Histoire, géographie et culture","m":"CR","q":"Parmi ces pays, lequel attire le plus de visiteurs chaque année ?","a":"La France, pays le plus visité au monde, avec près de cent millions de touristes étrangers par an."},{"i":533,"t":"Histoire, géographie et culture","m":"CR","q":"Où habite la majorité des Français ?","a":"En ville : plus de huit Français sur dix vivent dans une aire urbaine."},{"i":534,"t":"Histoire, géographie et culture","m":"CR","q":"Quelle région est la plus peuplée ?","a":"L'Île-de-France."},{"i":535,"t":"Histoire, géographie et culture","m":"CR","q":"Quelle ville française fait partie des 10 plus grandes métropoles du pays ?","a":"Paris, Marseille, Lyon, Toulouse, Nice, Nantes, Montpellier, Strasbourg, Bordeaux ou Lille."},{"i":536,"t":"Histoire, géographie et culture","m":"CR","q":"Lequel de ces départements de France est le plus touristique ?","a":"Paris."},{"i":537,"t":"Histoire, géographie et culture","m":"CR","q":"Quand peut-on visiter gratuitement des lieux culturels en France ?","a":"Lors des Journées européennes du patrimoine en septembre, de la Nuit européenne des musées au printemps, et le premier dimanche du mois dans de nombreux musées nationaux."},{"i":538,"t":"Histoire, géographie et culture","m":"CR","q":"Combien de personnes parlent français dans le monde ?","a":"Environ 320 millions."},{"i":539,"t":"Histoire, géographie et culture","m":"CR","q":"Qui était Marguerite Yourcenar ?","a":"Une écrivaine française, première femme élue à l'Académie française, en 1980."},{"i":540,"t":"Histoire, géographie et culture","m":"CR","q":"Quel peintre est français ?","a":"Claude Monet, Auguste Renoir, Paul Cézanne ou Eugène Delacroix."},{"i":541,"t":"Histoire, géographie et culture","m":"CR","q":"Quel musée est situé à Paris ?","a":"Le Louvre, le musée d'Orsay ou le Centre Pompidou."},{"i":542,"t":"Histoire, géographie et culture","m":"CR","q":"Qui était Auguste Rodin ?","a":"Un sculpteur français, auteur du Penseur."},{"i":543,"t":"Histoire, géographie et culture","m":"CR","q":"Quel est le classement de la langue française parmi les langues les plus parlées dans le monde ?","a":"Cinquième."},{"i":544,"t":"Histoire, géographie et culture","m":"CR","q":"Quelle cathédrale célèbre a été en partie détruite par un incendie en 2019 ?","a":"Notre-Dame de Paris."},{"i":545,"t":"Histoire, géographie et culture","m":"CR","q":"Qui était une écrivaine française célèbre ?","a":"George Sand, Simone de Beauvoir ou Marguerite Yourcenar."},{"i":546,"t":"Histoire, géographie et culture","m":"CR","q":"Qui était un célèbre musicien français ?","a":"Claude Debussy, Maurice Ravel ou Hector Berlioz. Parmi les chanteurs : Édith Piaf, Charles Aznavour, Georges Brassens."},{"i":547,"t":"Histoire, géographie et culture","m":"CR","q":"Qui était Auguste Renoir ?","a":"Un peintre français, l'un des maîtres de l'impressionnisme."},{"i":548,"t":"Histoire, géographie et culture","m":"CR","q":"Quelle fête est française ?","a":"La Fête de la musique, le 21 juin, ou la fête nationale du 14 juillet."},{"i":549,"t":"Histoire, géographie et culture","m":"CSP","q":"En quelle année a débuté la Révolution française ?","a":"1789."},{"i":550,"t":"Histoire, géographie et culture","m":"CSP","q":"Qui était Napoléon Ier ?","a":"Un général devenu empereur des Français en 1804."},{"i":551,"t":"Histoire, géographie et culture","m":"CSP","q":"Lequel de ces personnages historiques est français ?","a":"Napoléon Ier, Charles de Gaulle, Molière, Jules Ferry ou Victor Hugo, selon les options."},{"i":552,"t":"Histoire, géographie et culture","m":"CSP","q":"Dans quelle République est-on aujourd'hui ?","a":"La Ve République."},{"i":553,"t":"Histoire, géographie et culture","m":"CSP","q":"Qu'est-ce que la Shoah ?","a":"Le génocide des Juifs d'Europe organisé par l'Allemagne nazie pendant la Seconde Guerre mondiale : environ six millions de personnes assassinées."},{"i":554,"t":"Histoire, géographie et culture","m":"CSP","q":"Quel pays ou région du monde a été colonisé par la France ?","a":"L'Algérie, le Maroc, la Tunisie, l'Afrique de l'Ouest, Madagascar ou l'Indochine."},{"i":555,"t":"Histoire, géographie et culture","m":"CSP","q":"Qui a rendu l'école gratuite, laïque et obligatoire ?","a":"Jules Ferry."},{"i":556,"t":"Histoire, géographie et culture","m":"CSP","q":"Quand a eu lieu la Seconde Guerre mondiale ?","a":"De 1939 à 1945."},{"i":557,"t":"Histoire, géographie et culture","m":"CSP","q":"Quand a eu lieu la Première Guerre mondiale ?","a":"De 1914 à 1918."},{"i":558,"t":"Histoire, géographie et culture","m":"CSP","q":"En quelle année a été créée la Communauté économique européenne (CEE) ?","a":"1957, par le traité de Rome."},{"i":559,"t":"Histoire, géographie et culture","m":"CSP","q":"Le 11 novembre est un jour férié. À quoi correspond cette date ?","a":"À l'armistice du 11 novembre 1918, qui met fin à la Première Guerre mondiale."},{"i":560,"t":"Histoire, géographie et culture","m":"CSP","q":"Qui a été le premier président élu sous la Ve République ?","a":"Charles de Gaulle."},{"i":561,"t":"Histoire, géographie et culture","m":"CSP","q":"En quelle année l'esclavage a-t-il été aboli définitivement en France ?","a":"1848."},{"i":562,"t":"Histoire, géographie et culture","m":"CSP","q":"Depuis quelle année l'école publique est-elle gratuite ?","a":"1881. L'école devient obligatoire et laïque en 1882."},{"i":563,"t":"Histoire, géographie et culture","m":"CSP","q":"Combien y a-t-il eu de républiques en France ?","a":"Cinq. Nous sommes dans la Ve République."},{"i":564,"t":"Histoire, géographie et culture","m":"CSP","q":"Qui était le roi de France au moment de la Révolution française ?","a":"Louis XVI."},{"i":565,"t":"Histoire, géographie et culture","m":"CSP","q":"Qui a fondé la Ve République ?","a":"Le général Charles de Gaulle, en 1958."},{"i":566,"t":"Histoire, géographie et culture","m":"CSP","q":"Que célèbre-t-on le 14 juillet ?","a":"La fête nationale : la prise de la Bastille de 1789 et la Fête de la Fédération de 1790."},{"i":567,"t":"Histoire, géographie et culture","m":"CSP","q":"Quelle guerre a eu lieu entre 1914 et 1918 ?","a":"La Première Guerre mondiale."},{"i":568,"t":"Histoire, géographie et culture","m":"CSP","q":"Pourquoi l'année 1958 est importante pour la France ?","a":"C'est l'année de la fondation de la Ve République et de la Constitution du 4 octobre 1958."},{"i":569,"t":"Histoire, géographie et culture","m":"CSP","q":"Quel fleuve coule en France ?","a":"La Loire, la Seine, le Rhône ou la Garonne."},{"i":570,"t":"Histoire, géographie et culture","m":"CSP","q":"Quelle ville est française ?","a":"Paris, Marseille, Lyon, Toulouse, Bordeaux, Lille ou Nantes."},{"i":571,"t":"Histoire, géographie et culture","m":"CSP","q":"Quel océan borde la côte ouest française ?","a":"L'océan Atlantique."},{"i":572,"t":"Histoire, géographie et culture","m":"CSP","q":"Qu'est-ce que Paris ?","a":"La capitale de la France."},{"i":573,"t":"Histoire, géographie et culture","m":"CSP","q":"Quelle est la capitale de la France ?","a":"Paris."},{"i":574,"t":"Histoire, géographie et culture","m":"CSP","q":"Sur quel continent se situe la France métropolitaine ?","a":"L'Europe."},{"i":575,"t":"Histoire, géographie et culture","m":"CSP","q":"Quelle île est un département d'outre-mer français ?","a":"La Guadeloupe, la Martinique, La Réunion ou Mayotte. La Guyane est un département d'outre-mer mais n'est pas une île."},{"i":576,"t":"Histoire, géographie et culture","m":"CSP","q":"Combien y a-t-il de régions en France métropolitaine ?","a":"13."},{"i":577,"t":"Histoire, géographie et culture","m":"CSP","q":"Quelle ville est un grand port maritime ?","a":"Marseille, Le Havre, Dunkerque ou Nantes-Saint-Nazaire."},{"i":578,"t":"Histoire, géographie et culture","m":"CSP","q":"Quelle est la mer au sud de la France métropolitaine ?","a":"La mer Méditerranée."},{"i":579,"t":"Histoire, géographie et culture","m":"CSP","q":"Quelle ville est située au bord de la mer Méditerranée ?","a":"Marseille, Nice, Toulon ou Montpellier."},{"i":580,"t":"Histoire, géographie et culture","m":"CSP","q":"Où se situe la Corse ?","a":"En mer Méditerranée."},{"i":581,"t":"Histoire, géographie et culture","m":"CSP","q":"Quelle chaîne de montagnes est située entre la France et l'Italie ?","a":"Les Alpes."},{"i":582,"t":"Histoire, géographie et culture","m":"CSP","q":"Qui était Molière ?","a":"Un auteur de théâtre et comédien français du XVIIe siècle."},{"i":583,"t":"Histoire, géographie et culture","m":"CSP","q":"Qui était Charles Baudelaire ?","a":"Un poète français du XIXe siècle, auteur des Fleurs du mal."},{"i":584,"t":"Histoire, géographie et culture","m":"CSP","q":"Qui était George Sand ?","a":"Une romancière française du XIXe siècle."},{"i":585,"t":"Histoire, géographie et culture","m":"CSP","q":"Qui était Simone de Beauvoir ?","a":"Une écrivaine et philosophe française, autrice du Deuxième Sexe."},{"i":586,"t":"Histoire, géographie et culture","m":"CSP","q":"Qui était Albert Camus ?","a":"Un écrivain français, prix Nobel de littérature en 1957."},{"i":587,"t":"Histoire, géographie et culture","m":"CSP","q":"Qui était Paul Cézanne ?","a":"Un peintre français."},{"i":588,"t":"Histoire, géographie et culture","m":"CSP","q":"Qui était Marc Chagall ?","a":"Un peintre né en Russie, devenu français."},{"i":589,"t":"Histoire, géographie et culture","m":"CSP","q":"Qui était Joséphine Baker ?","a":"Une artiste américaine devenue française, résistante pendant la Seconde Guerre mondiale, entrée au Panthéon en 2021."},{"i":590,"t":"Histoire, géographie et culture","m":"CSP","q":"Qui était une chanteuse française célèbre ?","a":"Édith Piaf."},{"i":591,"t":"Histoire, géographie et culture","m":"CSP","q":"Qu'est-ce que le Louvre ?","a":"Un musée situé à Paris, le plus visité du monde. Il abrite la Joconde."},{"i":592,"t":"Histoire, géographie et culture","m":"CSP","q":"Qui était Jean de La Fontaine ?","a":"Un écrivain français du XVIIe siècle, célèbre pour ses fables."},{"i":593,"t":"Histoire, géographie et culture","m":"CSP","q":"Quel écrivain est français ?","a":"Victor Hugo, Molière, Albert Camus, Jean de La Fontaine ou Simone de Beauvoir."},{"i":594,"t":"Histoire, géographie et culture","m":"CSP","q":"Dans quelle ville se trouve la tour Eiffel ?","a":"À Paris."},{"i":595,"t":"Histoire, géographie et culture","m":"CSP","q":"Quand célèbre-t-on Noël ?","a":"Le 25 décembre."},{"i":596,"t":"Vivre dans la société française","m":"CR","q":"Quel mariage est reconnu par l'État ?","a":"Le mariage civil, célébré en mairie par un officier d'état civil. Un mariage religieux seul n'a aucun effet juridique."},{"i":597,"t":"Vivre dans la société française","m":"CR","q":"Auprès de quelle institution les parents peuvent-ils inscrire leur enfant à l'école publique ?","a":"La mairie de la commune de résidence, puis l'établissement scolaire."},{"i":598,"t":"Vivre dans la société française","m":"CR","q":"En cas de divorce, qui exerce l'autorité parentale ?","a":"Les deux parents conjointement. Le divorce ne met pas fin à l'autorité parentale ; seul un juge peut la retirer."},{"i":599,"t":"Vivre dans la société française","m":"CR","q":"Quelle aide permet aux personnes qui ont des difficultés financières d'avoir un avocat ?","a":"L'aide juridictionnelle, qui prend en charge tout ou partie des frais d'avocat et de justice."},{"i":600,"t":"Vivre dans la société française","m":"CR","q":"Où faut-il déclarer la naissance d'un enfant ?","a":"À la mairie du lieu de naissance, dans les cinq jours ouvrables."},{"i":601,"t":"Vivre dans la société française","m":"CR","q":"Quelle est l'une des conditions pour passer l'examen du permis de conduire ?","a":"Avoir l'âge requis, 17 ou 18 ans selon la formule, résider en France et avoir obtenu l'épreuve du code de la route."},{"i":602,"t":"Vivre dans la société française","m":"CR","q":"Un bail locatif est valide s'il est :","a":"Écrit. Un bail écrit est obligatoire et protège autant le locataire que le propriétaire."},{"i":603,"t":"Vivre dans la société française","m":"CR","q":"Où peut-on déposer un lave-vaisselle cassé ?","a":"En déchèterie, ou en faisant appel au service d'enlèvement des encombrants de la commune. Le laisser sur le trottoir est sanctionné."},{"i":604,"t":"Vivre dans la société française","m":"CR","q":"Quel numéro d'urgence permet d'appeler la police ?","a":"Le 17. Le 112, numéro d'urgence européen, permet aussi de les joindre."},{"i":605,"t":"Vivre dans la société française","m":"CR","q":"Concernant l'accès aux soins, quelle proposition est correcte ?","a":"L'accès aux soins est ouvert à tous, y compris aux personnes étrangères. Il faut déclarer un médecin traitant et passer par lui pour un problème non urgent, les urgences hospitalières étant réservées aux situations graves."},{"i":606,"t":"Vivre dans la société française","m":"CR","q":"À qui est accessible la contraception ?","a":"À toutes les personnes qui le souhaitent, y compris aux mineures, de façon confidentielle et gratuite dans de nombreux cas."},{"i":607,"t":"Vivre dans la société française","m":"CR","q":"Qu'est-ce que le principe de confidentialité dans le domaine de la santé ?","a":"L'obligation faite aux professionnels de santé de ne divulguer à personne les informations concernant un patient, y compris à sa famille ou à son employeur. C'est le secret médical."},{"i":608,"t":"Vivre dans la société française","m":"CR","q":"L'inscription à l'Assurance maladie est :","a":"Obligatoire. Ce n'est pas un choix."},{"i":609,"t":"Vivre dans la société française","m":"CR","q":"Qui peut demander un congé parental d'éducation ?","a":"Le père comme la mère, sous réserve d'une ancienneté suffisante dans l'entreprise."},{"i":610,"t":"Vivre dans la société française","m":"CR","q":"Quelles sont les affaires traitées par le conseil de prud'hommes ?","a":"Les litiges individuels entre un salarié et son employeur liés au contrat de travail : licenciement contesté, salaires impayés, heures supplémentaires, harcèlement."},{"i":611,"t":"Vivre dans la société française","m":"CR","q":"Travailler sans être déclaré est :","a":"Illégal. C'est un délit, qui prive le salarié de toute protection sociale et expose l'employeur à de lourdes sanctions."},{"i":612,"t":"Vivre dans la société française","m":"CR","q":"Lorsqu'un employeur veut qu'un salarié travaille plus longtemps que la durée prévue dans le contrat de travail :","a":"Ce sont des heures supplémentaires : elles doivent être payées à un taux majoré, ou récupérées, et elles ne peuvent pas être imposées sans limite."},{"i":613,"t":"Vivre dans la société française","m":"CR","q":"Quelle est la mission de France Travail ?","a":"Accompagner les personnes à la recherche d'un emploi ou en reconversion, et aider les entreprises à recruter."},{"i":614,"t":"Vivre dans la société française","m":"CR","q":"Dans une entreprise, le droit syndical permet :","a":"D'adhérer librement au syndicat de son choix, ou à aucun, et d'être représenté et défendu collectivement."},{"i":615,"t":"Vivre dans la société française","m":"CR","q":"Dans une entreprise, le droit de grève autorise :","a":"Les salariés à cesser collectivement le travail pour défendre des revendications professionnelles. Le gréviste n'est pas payé pendant la grève mais ne peut pas être sanctionné pour ce motif."},{"i":616,"t":"Vivre dans la société française","m":"CR","q":"Quelles sont les conditions pour toucher les allocations chômage ?","a":"Avoir travaillé une durée minimale, avoir perdu son emploi involontairement, être inscrit à France Travail, rechercher activement un emploi et résider en France."},{"i":617,"t":"Vivre dans la société française","m":"CR","q":"Qu'est-ce que l'école maternelle ?","a":"Le premier niveau de l'école, pour les enfants de 3 à 6 ans. Elle est gratuite dans le public et obligatoire depuis 2019."},{"i":618,"t":"Vivre dans la société française","m":"CR","q":"Comment s'appelle le diplôme passé par les élèves à la fin du collège ?","a":"Le diplôme national du brevet."},{"i":619,"t":"Vivre dans la société française","m":"CR","q":"Les parents d'élève ont le droit de :","a":"Être informés des résultats de leur enfant, rencontrer les enseignants, élire des représentants et participer aux conseils d'école."},{"i":620,"t":"Vivre dans la société française","m":"CR","q":"Qui peut manger à la cantine scolaire ?","a":"Tous les élèves, sans discrimination. La cantine est payante, avec des tarifs modulés selon les revenus."},{"i":621,"t":"Vivre dans la société française","m":"CR","q":"À quel âge commence l'instruction obligatoire des enfants ?","a":"3 ans."},{"i":622,"t":"Vivre dans la société française","m":"CR","q":"Quel est l'âge de la majorité ?","a":"18 ans."},{"i":623,"t":"Vivre dans la société française","m":"CR","q":"À l'école, il est interdit aux parents de :","a":"Entrer dans les classes sans autorisation, perturber le fonctionnement de l'établissement, ou contester un enseignement, une activité ou la mixité pour un motif religieux."},{"i":624,"t":"Vivre dans la société française","m":"CR","q":"Quel motif d'absence est accepté par l'école ?","a":"La maladie de l'enfant, une maladie contagieuse dans la famille, une réunion solennelle de famille, un empêchement de transport, l'absence temporaire des responsables. Des vacances hors calendrier scolaire ne sont pas un motif valable."},{"i":625,"t":"Vivre dans la société française","m":"CR","q":"Des parents ne respectent pas l'obligation d'instruction pour leurs enfants. Quelle sanction maximale risquent-ils ?","a":"Jusqu'à six mois d'emprisonnement et 7 500 euros d'amende."},{"i":626,"t":"Vivre dans la société française","m":"CR","q":"Quand ont lieu les vacances scolaires de Noël ?","a":"Environ deux semaines fin décembre et début janvier, à cheval sur Noël et le Nouvel An."},{"i":627,"t":"Vivre dans la société française","m":"CR","q":"À l'école, un enfant en situation de handicap :","a":"A le droit d'être scolarisé en milieu ordinaire, avec les aménagements et l'accompagnement nécessaires."},{"i":628,"t":"Vivre dans la société française","m":"CSP","q":"Quel numéro d'urgence permet d'appeler le SAMU ?","a":"Le 15."},{"i":629,"t":"Vivre dans la société française","m":"CSP","q":"Quel numéro d'urgence permet d'appeler les pompiers ?","a":"Le 18."},{"i":630,"t":"Vivre dans la société française","m":"CSP","q":"Après avoir obtenu le permis de conduire, que faut-il faire pour pouvoir conduire sa voiture ?","a":"Assurer le véhicule et faire établir la carte grise, le certificat d'immatriculation. Sans assurance, conduire est illégal."},{"i":631,"t":"Vivre dans la société française","m":"CSP","q":"À quelles conditions un mariage est-il reconnu juridiquement ?","a":"Il doit être célébré en mairie par un officier d'état civil, avec le consentement libre des deux personnes, majeures et non déjà mariées."},{"i":632,"t":"Vivre dans la société française","m":"CSP","q":"Quand faut-il déclarer son enfant au service d'état civil de la mairie ?","a":"Dans les cinq jours ouvrables suivant la naissance."},{"i":633,"t":"Vivre dans la société française","m":"CSP","q":"Le travail non déclaré est :","a":"Illégal, et c'est un délit."},{"i":634,"t":"Vivre dans la société française","m":"CSP","q":"Que doit faire un employeur pour fixer un salaire ?","a":"Respecter au minimum le SMIC et les minima de la convention collective, et appliquer l'égalité de rémunération entre les femmes et les hommes pour un même travail."},{"i":635,"t":"Vivre dans la société française","m":"CSP","q":"Qu'est-ce que le SMIC ?","a":"Le salaire minimum interprofessionnel de croissance : le salaire horaire minimum légal en dessous duquel aucun salarié ne peut être payé."},{"i":636,"t":"Vivre dans la société française","m":"CSP","q":"Quelle est la première démarche à réaliser pour chercher un emploi ?","a":"S'inscrire à France Travail."},{"i":637,"t":"Vivre dans la société française","m":"CSP","q":"Quelle est la durée légale du temps de travail par semaine ?","a":"35 heures."},{"i":638,"t":"Vivre dans la société française","m":"CSP","q":"Qui est aidé par France Travail ?","a":"Les personnes à la recherche d'un emploi ou en reconversion, ainsi que les entreprises qui recrutent."},{"i":639,"t":"Vivre dans la société française","m":"CSP","q":"Une personne étrangère en situation régulière peut créer son entreprise :","a":"Oui, dès lors que son titre de séjour l'autorise à exercer une activité."},{"i":640,"t":"Vivre dans la société française","m":"CSP","q":"Une femme peut-elle créer son entreprise ?","a":"Oui, librement et sans autorisation de qui que ce soit."},{"i":641,"t":"Vivre dans la société française","m":"CSP","q":"À partir de quel âge un mineur peut-il travailler ?","a":"16 ans, avec des dérogations dès 14 ou 15 ans pour des travaux légers pendant les vacances ou pour l'apprentissage."},{"i":642,"t":"Vivre dans la société française","m":"CSP","q":"Auprès de quel organisme faut-il demander le remboursement des frais de santé ?","a":"L'Assurance maladie, via la caisse primaire d'assurance maladie, la CPAM."},{"i":643,"t":"Vivre dans la société française","m":"CSP","q":"Qu'est-ce qu'un numéro d'urgence ?","a":"Un numéro de téléphone gratuit, accessible 24 heures sur 24, qui permet d'appeler les secours en cas de danger ou d'urgence."},{"i":644,"t":"Vivre dans la société française","m":"CSP","q":"Concernant l'accès aux soins, quelle proposition est correcte ?","a":"L'accès aux soins est ouvert à tous. Il faut déclarer un médecin traitant et le consulter en premier pour un problème non urgent."},{"i":645,"t":"Vivre dans la société française","m":"CSP","q":"En cas de problème de santé non urgent, à qui faut-il s'adresser en premier ?","a":"À son médecin traitant, généralement un généraliste."},{"i":646,"t":"Vivre dans la société française","m":"CSP","q":"Quel est le rôle du médecin traitant ?","a":"Soigner, suivre le patient dans la durée, coordonner son parcours de soins et l'orienter vers un spécialiste si nécessaire."},{"i":647,"t":"Vivre dans la société française","m":"CSP","q":"Dans quelles situations doit-on se rendre aux urgences de l'hôpital ?","a":"Uniquement en cas de situation grave ou vitale : accident, malaise, hémorragie, difficulté respiratoire. Pas pour un problème courant."},{"i":648,"t":"Vivre dans la société française","m":"CSP","q":"Quel est l'objectif des vaccinations obligatoires ?","a":"Protéger l'enfant vacciné et protéger la collectivité, en empêchant la circulation des maladies."},{"i":649,"t":"Vivre dans la société française","m":"CSP","q":"À quoi sert la carte Vitale ?","a":"Elle atteste de vos droits à l'Assurance maladie et permet le remboursement automatique des soins."},{"i":650,"t":"Vivre dans la société française","m":"CSP","q":"À quoi sert une mutuelle santé ?","a":"À rembourser la part des frais de santé qui reste à votre charge après le remboursement de l'Assurance maladie."},{"i":651,"t":"Vivre dans la société française","m":"CSP","q":"Jusqu'à quel âge l'école est-elle obligatoire ?","a":"Jusqu'à 16 ans. Une obligation de formation se prolonge ensuite jusqu'à 18 ans."},{"i":652,"t":"Vivre dans la société française","m":"CSP","q":"L'autorité parentale prévoit l'obligation :","a":"De protéger l'enfant : assurer sa sécurité, sa santé, sa moralité, son éducation et son entretien, sans violence physique ni psychologique."},{"i":653,"t":"Vivre dans la société française","m":"CSP","q":"Pour qui l'école est-elle obligatoire ?","a":"Pour tous les enfants résidant en France de 3 à 16 ans, quelle que soit leur nationalité et quelle que soit la situation administrative de leurs parents."},{"i":654,"t":"Vivre dans la société française","m":"CSP","q":"Quel diplôme obtient-on à la fin du lycée ?","a":"Le baccalauréat."},{"i":655,"t":"Vivre dans la société française","m":"CSP","q":"Dans quels établissements scolaires vont les élèves après l'école élémentaire ?","a":"Au collège."},{"i":656,"t":"Vivre dans la société française","m":"CSP","q":"Un enfant inscrit à l'école :","a":"Doit y aller régulièrement ; ses absences doivent être justifiées par un motif valable."},{"i":657,"t":"Vivre dans la société française","m":"CSP","q":"Les enfants qui ne parlent pas français :","a":"Sont scolarisés normalement, dans une classe ordinaire de leur âge, avec un soutien linguistique renforcé pour apprendre le français."}],"cours":[{"num":1,"titre":"Principes et valeurs de la République","theme":"Principes et valeurs de la République","nq":38,"npts":11,"chapo":"Devise et symboles, libertés, égalité et non-discrimination, solidarité et impôt, laïcité.","blocs":[{"k":"h1","t":"La République et sa devise"},{"k":"p","t":"La <b>République</b> s'oppose à la monarchie : le chef de l'État est élu, pour une durée limitée. L'article 1er de la Constitution la définit comme <b>indivisible, laïque, démocratique et sociale</b>. L'article 3 précise que la <b>souveraineté nationale appartient au peuple</b>, qui l'exerce par ses représentants et par le référendum."},{"k":"p","t":"La devise est <b>Liberté, Égalité, Fraternité</b>, inscrite à l'article 2. On la lit sur le fronton des mairies et des écoles, sur les pièces de monnaie et les documents officiels."},{"k":"h2","t":"Liberté"},{"k":"p","t":"La liberté est le droit de faire tout ce qui ne nuit pas à autrui. Elle n'est donc jamais absolue : la loi peut la limiter pour protéger l'ordre public ou les droits des autres. Les libertés que votre liste interroge nommément :"},{"k":"b","t":"<b>expression</b> : dire, écrire et publier ses opinions, y compris critiques. Les mêmes limites s'appliquent en ligne — l'injure, la diffamation, le harcèlement et la provocation à la haine sont des infractions sur les réseaux sociaux comme ailleurs ;"},{"k":"b","t":"<b>conscience et religion</b> : croire, ne pas croire, changer de religion ou cesser de croire ;"},{"k":"b","t":"<b>association</b> : créer une association ou y adhérer librement, sans autorisation préalable, en vertu de la loi de 1901. Nul ne peut être contraint d'adhérer ;"},{"k":"b","t":"<b>circulation</b> : aller, venir et s'installer où l'on veut sur le territoire ;"},{"k":"b","t":"<b>mariage et choix de vie</b> : choisir son conjoint, se marier ou non, divorcer."},{"k":"h2","t":"Égalité"},{"k":"p","t":"Toutes les personnes ont les mêmes droits et les mêmes devoirs et sont traitées de la même façon par la loi. Ce n'est pas l'égalité des revenus, mais l'égalité <b>devant la loi</b> et l'égalité des chances. Elle emporte l'égalité entre les femmes et les hommes et la lutte contre les discriminations, le racisme, l'antisémitisme et la haine anti-LGBT."},{"k":"p","t":"Votre liste teste cette valeur par une situation d'embauche. Retenez la règle : lors d'un <b>entretien d'embauche</b>, on ne peut demander au candidat que des informations ayant un lien direct et nécessaire avec le poste et les compétences. L'origine, la religion, les opinions, la situation familiale, la grossesse et l'orientation sexuelle sont hors sujet et leur prise en compte constitue une discrimination pénalement sanctionnée."},{"k":"h2","t":"Fraternité"},{"k":"p","t":"La fraternité, c'est la capacité à voir en autrui un semblable malgré les différences. La fraternité républicaine est <b>civique, ni ethnique ni religieuse</b>. Elle se traduit par une solidarité organisée :"},{"k":"b","t":"<b>collective</b> : la Nation assure une protection à chacun. Remplir ses obligations fiscales est un acte solidaire qui finance les services publics ; déclarer ses revenus est obligatoire pour toute personne résidant fiscalement en France, quelle que soit sa nationalité et même sans impôt à payer ;"},{"k":"b","t":"<b>intergénérationnelle</b> : le soutien entre générations, dont les retraites sont l'exemple type ;"},{"k":"b","t":"la <b>sécurité sociale</b>, créée en <b>1945</b>, en est l'instrument principal."},{"k":"h1","t":"Les symboles"},{"k":"tab","entetes":["Symbole","À retenir"],"lignes":[["Drapeau","Bleu, blanc, rouge. L'outrage public au drapeau est sanctionné"],["Hymne","La Marseillaise, composée par Rouget de Lisle en 1792. « Allons enfants de la patrie, le jour de gloire est arrivé »"],["Devise","Liberté, Égalité, Fraternité"],["Marianne","Allégorie de la République, coiffée du bonnet phrygien. Visible sur les timbres, les pièces d'euro et les documents officiels"],["Fête nationale","14 juillet : prise de la Bastille (1789) et Fête de la Fédération (1790)"],["Coq","Emblème coutumier, non inscrit dans la Constitution. On le voit sur les maillots de l'équipe de France"],["Langue","« Le français est la langue de la République » — article 2 de la Constitution"]]},{"k":"p","t":"Distinction que votre liste exploite : le drapeau, l'hymne et la devise sont les symboles <b>mentionnés par la Constitution</b> ; Marianne et le coq sont des symboles <b>coutumiers</b>, très largement utilisés mais non constitutionnels."},{"k":"h1","t":"La laïcité"},{"k":"p","t":"Elle repose sur trois piliers : la <b>liberté de conscience</b>, la <b>neutralité de l'État</b> et l'<b>égalité</b> de tous devant la loi quelles que soient leurs croyances. La laïcité n'est pas la négation des religions : elle organise les relations entre l'État et les religions."},{"k":"p","t":"Le texte fondateur est la <b>loi du 9 décembre 1905</b> de séparation des Églises et de l'État : la République garantit le libre exercice des cultes et ne reconnaît, ne salarie ni ne subventionne aucun culte. La <b>journée nationale de la laïcité</b> se célèbre le <b>9 décembre</b>, date anniversaire de cette loi. L'État peut toutefois entretenir les édifices religieux antérieurs à 1905 dont il est propriétaire et assurer leur sécurité."},{"k":"p","t":"La liberté de conscience, c'est croire, ne pas croire, ne plus croire, se convertir. Une personne qui ne croit en aucun dieu est <b>athée</b>. La liberté de conscience inclut le <b>droit au blasphème</b> : on peut critiquer une religion. Ce qui est puni n'est pas l'atteinte à une croyance mais l'atteinte aux <b>personnes</b> — l'injure, la diffamation, la provocation à la haine. L'<b>antisémitisme</b> désigne la haine ou les préjugés contre les Juifs ; c'est un délit."},{"k":"tab","entetes":["Situation","Ce que la laïcité impose"],"lignes":[["Agent public","Neutralité stricte : aucun signe religieux, aucune manifestation de conviction dans l'exercice des fonctions. Vaut pour tous les agents"],["Usager d'un service public","Il peut exprimer ses convictions et porter un signe religieux, dans le respect de l'ordre public. Il doit s'abstenir de tout prosélytisme et ne peut invoquer ses croyances pour échapper aux règles communes"],["École publique","Signes religieux ostensibles interdits aux élèves (loi du 15 mars 2004) ; seuls des signes discrets sont admis. On ne choisit pas les enseignements en fonction de ses croyances"],["Travail privé","Chacun a le droit d'avoir ses convictions. Leur expression peut être restreinte pour des impératifs d'hygiène, de sécurité ou de bon déroulement de l'activité"]]},{"k":"p","t":"La <b>Charte de la laïcité à l'École</b>, publiée en 2013, compte quinze articles et rappelle ces règles à toute la communauté scolaire ; son affichage est obligatoire dans les établissements publics."},{"k":"encadre","titre":"Les points de ce thème qui se retiennent par cœur","lignes":["Article 1er : indivisible, laïque, démocratique et sociale. Article 3 : la souveraineté appartient au peuple.","Loi du 9 décembre 1905 ; journée de la laïcité le 9 décembre ; Charte de la laïcité à l'école, 2013.","Sécurité sociale : 1945. Loi sur les signes religieux à l'école : 15 mars 2004.","Symboles constitutionnels : drapeau, hymne, devise. Coutumiers : Marianne, le coq.","Marianne porte le bonnet phrygien. Rouget de Lisle a composé La Marseillaise."]}]},{"num":2,"titre":"Système institutionnel et politique","theme":"Système institutionnel et politique","nq":56,"npts":6,"chapo":"Démocratie et droit de vote, organisation de la République, Union européenne. Le thème le plus chiffré : durées de mandat, nombres, sièges.","blocs":[{"k":"h1","t":"Démocratie, État de droit, séparation des pouvoirs"},{"k":"p","t":"L'<b>État de droit</b> est un système dans lequel la loi est au-dessus de tous : elle s'applique à toutes les personnes, y compris aux autorités publiques. C'est ce qui garantit que les droits et libertés de chacun sont protégés. Personne n'a le droit de ne pas respecter une loi."},{"k":"tab","entetes":["Pouvoir","Fonction","Qui l'exerce"],"lignes":[["Législatif","Faire et voter les lois","Le Parlement : députés et sénateurs"],["Exécutif","Appliquer les lois et gouverner","Le président de la République et le Gouvernement"],["Autorité judiciaire","Rendre la justice et sanctionner","Les juges et les tribunaux"]]},{"k":"p","t":"La séparation des pouvoirs est consacrée par l'article 16 de la Déclaration de 1789. Elle établit un équilibre : responsabilité du Gouvernement devant le Parlement, élection du président au suffrage universel direct, indépendance de la justice. C'est le <b>juge</b>, et non la police ni le maire, qui sanctionne l'auteur d'un vol."},{"k":"h1","t":"Voter et être candidat"},{"k":"p","t":"Pour voter en France il faut avoir la <b>nationalité française</b>, être <b>majeur</b>, ne pas avoir été privé de ses droits civils et politiques, et être <b>inscrit sur les listes électorales</b>. L'inscription est automatique à 18 ans pour les jeunes recensés ; sinon elle se demande, notamment après un déménagement, en ligne ou <b>à la mairie</b> de son domicile. Le vote n'est <b>pas obligatoire</b> en France."},{"k":"p","t":"Adhérer à un parti politique est libre et facultatif. La <b>pluralité des partis</b> est une condition nécessaire de la démocratie."},{"k":"tab","entetes":["Élection","On y élit","Durée","Précision"],"lignes":[["Présidentielle","Le président de la République","5 ans","Suffrage universel direct. Candidature : être français, majeur, et réunir 500 parrainages d'élus"],["Législatives","Les députés","5 ans","Suffrage universel direct"],["Sénatoriales","Les sénateurs","6 ans","Suffrage indirect, renouvellement par moitié tous les 3 ans"],["Municipales","Les conseillers municipaux","6 ans","Ils élisent ensuite le maire parmi eux. Candidat : majeur, français ou citoyen de l'UE, inscrit dans la commune ou y étant contribuable"],["Européennes","Les députés européens","5 ans","Suffrage universel direct"]]},{"k":"h1","t":"Qui fait quoi"},{"k":"b","t":"Le <b>président de la République</b> est chef de l'État et chef des armées, garant de la Constitution. Il nomme le Premier ministre, préside le conseil des ministres, promulgue les lois et peut dissoudre l'Assemblée nationale. En cas de décès, l'intérim est assuré par le <b>président du Sénat</b>."},{"k":"b","t":"Le <b>Premier ministre</b> est le chef du Gouvernement : il <b>dirige l'action du Gouvernement</b> et assure l'exécution des lois. Il est <b>nommé par le président</b>."},{"k":"b","t":"Le <b>maire</b> dirige la commune, exécute les décisions du conseil municipal, et il est aussi agent de l'État comme officier d'état civil et de police judiciaire. Il est <b>élu par le conseil municipal</b>."},{"k":"b","t":"Le <b>préfet</b> représente l'État dans le département. Il est <b>nommé</b>, pas élu."},{"k":"b","t":"Le <b>Conseil constitutionnel</b> vérifie la conformité des lois à la Constitution et veille à la régularité des élections."},{"k":"b","t":"Le <b>Défenseur des droits</b> est une autorité indépendante qui défend les droits face aux administrations, lutte contre les discriminations et protège les droits de l'enfant. Sa saisine est gratuite."},{"k":"p","t":"Modifier la <b>Constitution</b> suppose un vote en termes identiques des deux chambres, puis soit un référendum, soit l'approbation du Parlement réuni en Congrès à la majorité des trois cinquièmes."},{"k":"h1","t":"Le découpage administratif"},{"k":"tab","entetes":["Niveau","Nombre","Compétence que votre liste teste"],"lignes":[["Commune","environ 35 000","Écoles primaires et maternelles publiques, état civil, urbanisme"],["Département","101 (96 + 5 outre-mer)","Collèges publics, action sociale, routes départementales"],["Région","18 (13 + 5 outre-mer)","Lycées, transports régionaux, développement économique"]]},{"k":"h1","t":"L'Union européenne"},{"k":"tab","entetes":["Repère","Réponse"],"lignes":[["Première étape, 1951","La CECA, Communauté européenne du charbon et de l'acier (traité de Paris)"],["1957","Traité de Rome : Communauté économique européenne"],["1992","Traité de Maastricht : fondation de l'Union européenne et création de la citoyenneté européenne"],["Pays fondateurs","France, Allemagne, Italie, Belgique, Pays-Bas, Luxembourg"],["Dernier entrant, 2013","La Croatie"],["Sortie, 2020","Le Royaume-Uni"],["Nombre d'États","27 au 1er janvier 2025"],["Drapeau","Douze étoiles dorées en cercle sur fond bleu — le nombre ne varie pas"],["Hymne","L'Ode à la joie, composée par Beethoven"],["Devise","« Unie dans la diversité »"],["Journée de l'Europe","9 mai"],["Parlement européen","Siège à Strasbourg. Y siègent les députés européens, élus par les citoyens"],["Commission européenne","Siège à Bruxelles"],["Banque centrale européenne","Siège à Francfort"],["Droit de vote","Un citoyen de l'UE peut voter aux municipales et aux européennes dans un autre État membre, mais pas aux présidentielles ni aux législatives"]]},{"k":"encadre","titre":"Les chiffres à verrouiller","lignes":["Président 5 ans, députés 5 ans, sénateurs 6 ans, conseil municipal et maire 6 ans.","101 départements, 18 régions dont 13 en métropole, environ 35 000 communes.","500 parrainages pour se présenter à la présidentielle. Vote à partir de 18 ans.","27 États membres. Croatie en 2013, Royaume-Uni sorti en 2020.","Strasbourg le Parlement, Bruxelles la Commission, Francfort la Banque centrale."]}]},{"num":3,"titre":"Droits et devoirs","theme":"Droits et devoirs","nq":37,"npts":11,"chapo":"Droits fondamentaux et textes de référence, limites des libertés, obligations du résident et du citoyen. Six des onze questions sont des mises en situation non publiées : ce chapitre se travaille pour raisonner, pas pour réciter.","blocs":[{"k":"h1","t":"Les droits fondamentaux"},{"k":"p","t":"Ce sont les droits reconnus à toute personne du seul fait qu'elle est un être humain. On distingue les <b>droits et libertés individuels</b>, qui rendent chacun maître de ses mouvements, de ses choix, de ses opinions et de ses croyances, et les <b>droits sociaux et économiques</b>, qui visent à assurer des conditions de vie dignes : travail, grève, santé, éducation, protection sociale."},{"k":"p","t":"Les notions clés sont la <b>dignité humaine</b>, l'intégrité physique et psychologique, la <b>citoyenneté</b>, l'État de droit et la démocratie. La dignité est inviolable : elle interdit l'esclavage, la torture, les traitements dégradants et la traite des êtres humains."},{"k":"p","t":"Deux droits que votre liste isole : le <b>droit à la sûreté</b>, qui protège contre l'arrestation arbitraire, et le <b>droit de grève</b>, qui permet de cesser collectivement le travail pour des revend
