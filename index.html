ications professionnelles. Après une interpellation, on peut garder le silence, être assisté d'un avocat, faire prévenir un proche et voir un médecin."},{"k":"tab","entetes":["Texte","Date","Ce qu'il apporte"],"lignes":[["Déclaration des droits de l'homme et du citoyen","1789","« Les hommes naissent et demeurent libres et égaux en droits » (art. 1er). « La liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui » (art. 4). Séparation des pouvoirs (art. 16)"],["Constitution de la Ve République","1958","Organise les pouvoirs et garantit les droits. Texte suprême, le plus difficile à modifier"],["Charte de l'environnement","2004","Droit de vivre dans un environnement équilibré et respectueux de la santé, devoir de le préserver"]]},{"k":"h1","t":"Des libertés encadrées"},{"k":"p","t":"Les libertés sont limitées, en premier lieu par les libertés des autres, ensuite par la défense de l'<b>ordre public</b>, qui recouvre la sécurité, la tranquillité, la salubrité et le respect de la dignité humaine. La liberté d'expression peut ainsi être limitée pour l'injure, la diffamation, la provocation à la haine ou à la violence, l'apologie du terrorisme et l'atteinte à la vie privée."},{"k":"p","t":"Ces règles valent en ligne. La <b>citoyenneté numérique</b> désigne précisément l'exercice de ses droits et devoirs sur internet, avec les mêmes limites que dans la vie réelle. La <b>majorité numérique</b> est fixée à <b>15 ans</b> : en dessous, s'inscrire sur un réseau social requiert l'accord des parents."},{"k":"h1","t":"Les obligations"},{"k":"h2","t":"Obligations de toute personne résidant en France"},{"k":"b","t":"respecter la loi et l'ordre public ;"},{"k":"b","t":"<b>déclarer ses revenus chaque année</b> et payer impôts et cotisations sociales ;"},{"k":"b","t":"faire instruire ses enfants ;"},{"k":"b","t":"<b>porter secours à une personne en danger</b>, dès lors qu'on peut le faire sans risque. Ne pas le faire est un délit ;"},{"k":"b","t":"respecter les règles communes, autrui et l'environnement, et contribuer au bien collectif notamment par le travail."},{"k":"h2","t":"Obligations propres au citoyen français"},{"k":"p","t":"Voter — qui reste un droit et un devoir civique, non une obligation — et <b>être juré d'assises</b>. Cette dernière est une obligation : tout citoyen français d'au moins <b>23 ans</b>, sachant lire et écrire le français et jouissant de ses droits, peut être tiré au sort sur les listes électorales. Il doit se présenter ; l'employeur ne peut pas s'y opposer. S'y ajoutent le recensement à 16 ans et le devoir de défendre la Nation en cas de danger."},{"k":"p","t":"Une condamnation peut entraîner la <b>privation des droits civils et politiques</b> prononcée par un juge : pendant la durée fixée, la personne ne peut ni voter, ni être élue, ni être jurée d'assises."},{"k":"h1","t":"La typologie des infractions"},{"k":"tab","entetes":["Infraction","Gravité","Exemples de votre liste"],"lignes":[["Contravention","La moins grave","La plupart des infractions au code de la route, stationnement sur une place réservée aux personnes handicapées"],["Délit","Intermédiaire","Vol, travail dissimulé, conduite sans permis, discrimination, non-assistance à personne en danger, conduite en état d'ivresse"],["Crime","La plus grave","Meurtre, viol, vol à main armée"]]},{"k":"p","t":"Quelques interdits et seuils que votre liste vérifie directement : la <b>polygamie</b> est interdite ; la vente d'alcool est interdite aux <b>moins de 18 ans</b> ; il est interdit de fumer dans tous les lieux publics fermés et couverts, dans les transports et sur les aires de jeux ; conduire une moto sans permis est un délit. La <b>majorité civile</b> est fixée à <b>18 ans</b>."},{"k":"p","t":"Le <b>devoir de mémoire</b>, enfin, est l'obligation morale de se souvenir des événements tragiques de l'histoire, au premier rang desquels la Shoah, pour honorer les victimes et empêcher que cela se reproduise."},{"k":"encadre","titre":"La méthode pour les six mises en situation","lignes":["Identifiez le principe en jeu : liberté, égalité, laïcité, ordre public, protection de l'enfance.","Cherchez la limite : une liberté s'arrête aux libertés d'autrui puis à l'ordre public.","Aucune croyance ne permet de s'affranchir d'une règle commune. Cette phrase résout beaucoup de cas.","Face à une discrimination : c'est interdit, et le recours est le Défenseur des droits ou le juge.","Face à un danger : alerter, secourir sans se mettre en danger. L'inaction est un délit."]}]},{"num":4,"titre":"Histoire, géographie et culture","theme":"Histoire, géographie et culture","nq":83,"npts":8,"chapo":"Le tiers de votre liste pour 8 questions à l'examen. Presque uniquement de la reconnaissance : associer une date, un nom, un lieu. À travailler vite et souvent.","blocs":[{"k":"h1","t":"Les grandes périodes"},{"k":"tab","entetes":["Période","À retenir"],"lignes":[["Monarchie, jusqu'en 1789","Louis XIV, le Roi-Soleil. Les rois étaient couronnés à Reims. Louis XVI, roi en 1789, est guillotiné en 1793"],["Révolution, à partir de 1789","Prise de la Bastille le 14 juillet 1789 ; Déclaration des droits de l'homme et du citoyen ; Ire République en 1792"],["Empire, début XIXe","Napoléon Ier devient empereur en 1804 et fait adopter le Code civil"],["1re moitié du XIXe","Empire colonial français ; abolition définitive de l'esclavage en 1848, portée par Victor Schoelcher. Nantes fut le principal port négrier au XVIIIe siècle ; Montesquieu, parmi les Lumières, dénonça l'esclavage"],["À partir de 1880","Jules Ferry rend l'école gratuite (1881), puis obligatoire et laïque (1882)"],["1914-1918","Première Guerre mondiale. Armistice du 11 novembre 1918"],["1939-1945","Seconde Guerre mondiale. Appel du général de Gaulle le 18 juin 1940 ; Résistance (Jean Moulin, Lucie Aubrac) ; Shoah ; débarquement en Normandie le 6 juin 1944 ; Paris libéré en août 1944 ; capitulation le 8 mai 1945"],["1944-1945","Droit de vote des femmes en 1944. Création de l'ONU en 1945"],["1958","Fondation de la Ve République par Charles de Gaulle, Constitution du 4 octobre"],["Depuis 1958","Suffrage universel direct pour la présidentielle depuis 1962 ; décolonisation en Asie et en Afrique de 1950 à 1962 ; abolition de la peine de mort en 1981 sous François Mitterrand ; Union européenne en 1992 ; euro en 2002"]]},{"k":"p","t":"Les présidents de la Ve République : Charles de Gaulle, Georges Pompidou, Valéry Giscard d'Estaing, François Mitterrand, Jacques Chirac, Nicolas Sarkozy, François Hollande, Emmanuel Macron. <b>Simone Veil</b> a porté la loi de 1975 légalisant l'avortement et présidé le Parlement européen ; rescapée de la Shoah, elle est entrée au Panthéon."},{"k":"h1","t":"La géographie"},{"k":"tab","entetes":["Repère","Réponse"],"lignes":[["Situation","La France métropolitaine est en Europe"],["Mers et océans","Mer du Nord, Manche, océan Atlantique à l'ouest, Méditerranée au sud. La Manche sépare la France de l'Angleterre"],["Montagnes","Pyrénées entre France et Espagne ; Alpes entre France et Italie. Le mont Blanc est le plus haut sommet de France"],["Fleuve de Paris","La Seine"],["Population","Environ 68 millions d'habitants en 2025 ; 9 personnes sur 10 vivent en aire urbaine"],["Régions","13 en métropole, 18 au total"],["Chefs-lieux","Auvergne-Rhône-Alpes : Lyon. Bretagne : Rennes. Provence-Alpes-Côte d'Azur : Marseille"],["Port principal","Marseille"],["Outre-mer","Cinq départements et régions : Guadeloupe, Martinique, Guyane, La Réunion, Mayotte, 101e département depuis 2011. La Guyane a une frontière avec le Brésil et Kourou est la base de lancement d'Ariane. La Réunion et Mayotte sont dans l'océan Indien ; Mayotte est au sud-est de l'Afrique"],["Ski","Auvergne-Rhône-Alpes"],["Tourisme","La France est la première destination touristique au monde"]]},{"k":"h1","t":"Le patrimoine et la culture"},{"k":"tab","entetes":["Domaine","Noms de votre liste"],"lignes":[["Littérature","Molière, auteur de théâtre du XVIIe. Jean de La Fontaine, fabuliste. Victor Hugo (Les Misérables, Notre-Dame de Paris). Charles Baudelaire, poète. George Sand, romancière. Simone de Beauvoir, écrivaine et philosophe. Albert Camus, prix Nobel 1957. Marguerite Yourcenar, première femme à l'Académie française"],["Peinture","Claude Monet (les Nymphéas), Auguste Renoir, Paul Cézanne, Eugène Delacroix (La Liberté guidant le peuple)"],["Sculpture","Auguste Rodin, auteur du Penseur"],["Musique","Claude Debussy, Maurice Ravel, Hector Berlioz. Rouget de Lisle a composé La Marseillaise"],["Sciences","Marie Curie, deux prix Nobel, première femme entrée au Panthéon pour ses mérites"],["Monuments","Le Louvre, où est exposée la Joconde. Versailles, château de Louis XIV. La tour Eiffel, construite pour l'Exposition universelle de 1889. Le Mont-Saint-Michel, en Normandie. Lascaux et Chauvet pour les peintures préhistoriques"],["Gastronomie","Pot-au-feu, bœuf bourguignon, blanquette, ratatouille, cassoulet"],["Accès à la culture","Journées européennes du patrimoine et Nuit européenne des musées"],["Francophonie","321 millions de locuteurs, 5e langue mondiale"]]},{"k":"p","t":"Deux dates de jours fériés que votre liste isole : le <b>1er mai</b> symbolise la fête du travail et la lutte pour les droits des travailleurs ; le <b>11 novembre</b> commémore l'armistice de 1918 ; le <b>8 mai</b> la victoire de 1945."},{"k":"encadre","titre":"Le minimum vital si vous manquez de temps sur ce thème","lignes":["1789 Révolution · 1804 Empire et Code civil · 1848 abolition de l'esclavage · 1881-1882 lois Ferry.","1914-1918 et 1939-1945 les deux guerres · 18 juin 1940 l'appel · 6 juin 1944 le débarquement.","1944 vote des femmes · 1945 ONU · 1958 Ve République · 1981 peine de mort · 2002 euro.","Reims le sacre des rois, Nantes le port négrier, Kourou la base de lancement, Marseille le premier port.","Le mont Blanc, la Seine à Paris, les Pyrénées avec l'Espagne, les Alpes avec l'Italie, la Manche avec l'Angleterre.","Lyon, Rennes, Marseille pour les trois chefs-lieux demandés. Mayotte, 101e département."]}]},{"num":5,"titre":"Vivre dans la société française","theme":"Vivre dans la société française","nq":44,"npts":4,"chapo":"S'installer et résider, accès aux soins, travailler, autorité parentale et école. Une question sur chacun de ces quatre volets à l'examen.","blocs":[{"k":"h1","t":"S'installer et résider"},{"k":"tab","entetes":["Démarche","Ce qu'il faut savoir"],"lignes":[["Naissance","À déclarer à la mairie du lieu de naissance, dans les cinq jours ouvrables. Toute naissance doit être déclarée, sans exception"],["Mariage","Seul le mariage civil célébré en mairie est reconnu. Un mariage religieux seul n'a aucun effet juridique"],["Divorce","L'un ou l'autre des époux, ou les deux, peuvent le demander"],["Impôts","Déclaration de revenus obligatoire chaque année pour tout résident fiscal"],["Assurance","La responsabilité civile couvre les dommages causés à autrui ; elle est obligatoire pour un véhicule et un logement loué"],["Logement","Le locataire peut assurer l'entretien courant et repeindre sans autorisation ; les transformations exigent l'accord écrit du propriétaire"],["Avocat","L'aide juridictionnelle prend en charge les frais pour les revenus modestes"],["Encombrants","Un appareil hors d'usage se fait réparer, se dépose en déchèterie ou se fait reprendre. Le laisser sur le trottoir est sanctionné"],["Stationnement","Se garer sur une place réservée aux personnes handicapées sans carte mobilité inclusion est interdit et sanctionné"]]},{"k":"h1","t":"L'accès aux soins"},{"k":"p","t":"On déclare un <b>médecin traitant</b> auprès de l'Assurance maladie : c'est le premier interlocuteur pour tout problème de santé non urgent. Il soigne, suit dans la durée et oriente vers un spécialiste. Les <b>urgences de l'hôpital</b> sont réservées aux situations graves ou vitales."},{"k":"p","t":"L'inscription à l'<b>Assurance maladie est obligatoire</b>. Le remboursement des frais de santé se demande auprès de la <b>CPAM</b>. La <b>carte Vitale</b> atteste de vos droits et permet le remboursement automatique. La <b>mutuelle</b> rembourse ce qui reste à votre charge. Le <b>tiers payant</b> évite d'avancer les frais : l'Assurance maladie ou la mutuelle paie directement le professionnel."},{"k":"p","t":"Le <b>principe de confidentialité</b>, ou secret médical, interdit au professionnel de divulguer les informations d'un patient, y compris à sa famille ou à son employeur. S'y ajoutent le libre choix du praticien et le droit à l'information. Les <b>vaccinations obligatoires</b> protègent l'enfant vacciné et la collectivité. La <b>contraception</b> est libre et accessible à toutes, y compris aux mineures. L'<b>avortement</b> est légal depuis 1975, dans le délai de quatorze semaines de grossesse."},{"k":"p","t":"Numéros d'urgence : <b>15</b> le SAMU, <b>17</b> la police, <b>18</b> les pompiers, <b>112</b> le numéro européen, <b>114</b> par SMS."},{"k":"h1","t":"Travailler en France"},{"k":"tab","entetes":["Notion","À retenir"],"lignes":[["Durée légale","35 heures par semaine"],["SMIC","Salaire minimum légal en dessous duquel aucun salarié ne peut être payé"],["Fixer un salaire","Respecter le SMIC, la convention collective et l'égalité femmes-hommes"],["Règles applicables","Code du travail, convention collective, contrat de travail, règlement intérieur"],["Chercher un emploi","S'inscrire à France Travail"],["Travail non déclaré","Illégal, c'est un délit qui prive de toute protection sociale"],["Prud'hommes","Litiges individuels entre un salarié et son employeur nés du contrat de travail"],["Droit syndical","Tout salarié peut se syndiquer, quelle que soit sa nationalité"],["Grossesse","Licencier une femme en raison de sa grossesse est interdit ; le licenciement est nul"],["Congé parental","Le père comme la mère peuvent le demander"],["Congé paternité","25 jours calendaires depuis le 1er juillet 2021, 32 en cas de naissances multiples, plus 3 jours de congé de naissance"],["Entreprendre","Une femme, comme une personne étrangère en situation régulière dont le titre l'autorise, peut créer son entreprise"]]},{"k":"h1","t":"Autorité parentale et école"},{"k":"p","t":"L'<b>autorité parentale</b> est l'ensemble des droits et devoirs des parents pour protéger l'enfant : sécurité, santé, moralité, éducation et entretien, dans le respect de sa personne. Elle s'exerce <b>sans violence physique ni psychologique</b> : punir physiquement un enfant est interdit. Elle est exercée <b>conjointement par les deux parents</b>, y compris après un divorce ; seul un juge peut la retirer."},{"k":"p","t":"L'<b>instruction est obligatoire de 3 à 16 ans</b> pour tous les enfants résidant en France, quelle que soit leur nationalité. Ne pas la respecter expose à six mois d'emprisonnement et 7 500 euros d'amende. L'inscription à l'école publique se fait <b>à la mairie</b>. Après l'école élémentaire, les élèves vont au <b>collège</b>, puis au lycée."},{"k":"p","t":"Les parents peuvent être informés, rencontrer les enseignants, élire des représentants et participer aux conseils ; ils ne peuvent pas contester un enseignement pour un motif religieux. Les <b>absences</b> doivent être justifiées par un motif valable — maladie, réunion solennelle de famille, empêchement de transport — les vacances hors calendrier n'en étant pas un. Les enfants qui <b>ne parlent pas français</b> sont scolarisés dans une classe ordinaire de leur âge avec un soutien linguistique renforcé. Un enfant <b>en situation de handicap</b> a droit à une scolarisation en milieu ordinaire, avec les aménagements nécessaires."},{"k":"encadre","titre":"Les réflexes qui résolvent la plupart des questions de ce thème","lignes":["Problème de santé non urgent : le médecin traitant, jamais les urgences.","Une démarche : la forme la plus protectrice et la plus formelle est la bonne réponse.","Un droit lié à l'enfant : il vaut pour tous les enfants présents sur le territoire, sans condition de nationalité.","Un droit du travail : il vaut pour tout salarié, quelle que soit sa nationalité.","Naissance : 5 jours. Instruction : 3 à 16 ans. Travail : 35 heures. Majorité : 18 ans."]}]}]};

const $ = id => document.getElementById(id);
const main = $("main"), commandes = $("commandes"), rangee = $("rangee");
const echap = t => String(t).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const riche = t => String(t);
function melanger(a){ for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;
  [a[i],a[j]]=[a[j],a[i]]} return a }
function banque(){ const b = DONNEES.bank.slice();
  if (etat.importe) b.push(...etat.importe); return b; }
const mentions = () => [...new Set(banque().map(q => q.m))];
const libelleMention = m => ({CR:"Carte de résident", CSP:"Carte de séjour pluriannuelle",
  NAT:"Naturalisation", IMP:"Liste importée"})[m] || m;
let s = null;

function chrome(sous, compteur){
  $("sousTitre").textContent = sous;
  $("compteur").textContent = compteur || "";
  $("chrono").hidden = true; $("btnQuitter").hidden = true;
  commandes.hidden = true; $("jauge").style.width = "0";
  main.classList.remove("centre"); main.scrollTop = 0;
}
function bouton(t, cls, fn){ const b = document.createElement("button");
  b.className = cls; b.textContent = t; b.onclick = fn; return b; }

/* ---------------------------------------------------------------- accueil */
function accueil(){
  s = null; chrome("naturalisation");
  const dispo = mentions();
  if (!etat.filtreM || !dispo.includes(etat.filtreM)) etat.filtreM = "NAT";
  if (!etat.filtreT) etat.filtreT = "toutes";
  const tot = banque().filter(q => q.m === etat.filtreM).length;
  const vus = Object.keys(etat.vus).length, revoir = Object.keys(etat.arevoir).length;
  const lus = DONNEES.cours.filter(c => etat.lus[c.num]).length;

  main.innerHTML = `
  <div class="ecran">
    <h1>Apprendre, puis se tester</h1>
    <p class="chapo">Le cours d'abord, chapitre par chapitre. L'entraînement ensuite :
       une question à la fois, vous répondez de tête, ce que vous ratez revient.</p>
    <div class="stat">
      <div><b>${lus}<span style="font-size:15px;color:var(--gris)">/5</span></b><span>chapitres lus</span></div>
      <div><b>${vus}</b><span>questions vues</span></div>
      <div><b>${revoir}</b><span>à revoir</span></div>
    </div>
    <div class="rangee" style="margin-bottom:10px">
      <button class="btn" id="goCours">Ouvrir le cours</button></div>
    <div class="rangee" style="margin-bottom:26px">
      <button class="btn creux" id="goExam">Session chronométrée · 28 questions</button></div>
    <fieldset><legend>Liste</legend><div class="choix" id="chxM"></div></fieldset>
    <fieldset><legend>S'entraîner sur</legend><div class="choix" id="chxT"></div></fieldset>
    <div class="rangee" style="margin-bottom:10px">
      <button class="btn creux" id="go">Réviser ces ${selection().length} questions</button></div>
    <div class="rangee">
      <button class="btn creux" id="goRevoir" ${revoir?"":"disabled style=opacity:.4"}>
        Reprendre les ${revoir} à revoir</button></div>
    <p class="note">Vous préparez la mention naturalisation : ${tot} questions officielles.
      Les listes carte de résident et carte de séjour pluriannuelle sont également chargées
      si vous voulez varier les formulations.<br><br>
      <button class="lien" id="goImport">Importer une autre liste</button>&nbsp;·&nbsp;
      <button class="lien" id="goReset">Effacer ma progression</button></p>
  </div>`;

  const chxM = $("chxM");
  dispo.forEach(m => {
    const b = document.createElement("button");
    b.className = "puce"; b.setAttribute("aria-pressed", etat.filtreM === m);
    b.innerHTML = `${libelleMention(m)}<small>${banque().filter(q=>q.m===m).length} questions</small>`;
    b.onclick = () => { etat.filtreM = m; sauver(); accueil(); };
    chxM.appendChild(b);
  });
  const chxT = $("chxT");
  ["toutes", ...DONNEES.themes].forEach(t => {
    const b = document.createElement("button");
    b.className = "puce"; b.setAttribute("aria-pressed", etat.filtreT === t);
    b.textContent = t === "toutes" ? "Tous les thèmes" : t;
    b.onclick = () => { etat.filtreT = t; sauver(); accueil(); };
    chxT.appendChild(b);
  });
  $("goCours").onclick = sommaire;
  $("go").onclick = () => lancer(selection(), false);
  $("goRevoir").onclick = () => lancer(melanger(banque().filter(q => etat.arevoir[q.i])), false);
  $("goExam").onclick = () => lancer(tirageExamen(), true);
  $("goImport").onclick = ecranImport;
  $("goReset").onclick = () => { if (confirm("Effacer votre progression ?")){
      etat.vus = {}; etat.arevoir = {}; etat.lus = {}; sauver(); accueil(); } };
}
function selection(){
  return melanger(banque().filter(q => q.m === etat.filtreM &&
    (etat.filtreT === "toutes" || q.t === etat.filtreT)));
}
function tirageExamen(){
  const t = [];
  DONNEES.themes.forEach(th => {
    const pool = melanger(banque().filter(q => q.m === etat.filtreM && q.t === th));
    t.push(...pool.slice(0, DONNEES.quotas[th]));
  });
  return melanger(t);
}

/* ------------------------------------------------------------------ cours */
function sommaire(){
  chrome("le cours");
  const total = DONNEES.cours.reduce((a,c) => a + c.nq, 0);
  main.innerHTML = `<div class="ecran">
    <h1>Le cours</h1>
    <p class="chapo">Cinq chapitres, écrits à partir des ${total} questions officielles de la
      mention naturalisation. Le nombre de questions à l'examen indique où porter l'effort :
      le thème 4 pèse un tiers de la liste pour 8 questions, alors que les thèmes 1 et 3
      pèsent 22 questions dont 12 mises en situation qui ne sont pas publiées.</p>
    <div id="listeChap"></div>
    <p class="note">Questions officielles : ministère de l'Intérieur, liste du 12 janvier 2026,
      licence Etalab 2.0. Le cours et les réponses sont une rédaction personnelle : l'État ne
      publie ni corrigé ni options de réponse.</p></div>`;
  const l = $("listeChap");
  DONNEES.cours.forEach(c => {
    const b = document.createElement("button");
    b.className = "chap";
    b.innerHTML = `<b>${c.num}. ${c.titre}</b><span>${c.nq} questions de la liste ·
      ${c.npts} questions à l'examen ${etat.lus[c.num] ? "· <i>lu</i>" : ""}</span>`;
    b.onclick = () => lireChapitre(c.num);
    l.appendChild(b);
  });
  commandes.hidden = false; rangee.innerHTML = "";
  rangee.appendChild(bouton("Revenir au menu", "btn creux", accueil));
}

function lireChapitre(num){
  const c = DONNEES.cours.find(x => x.num === num);
  chrome("cours · thème " + num);
  let html = `<div class="cours"><p class="meta">Thème ${c.num} sur 5</p>
    <h2>${c.titre}</h2>
    <p class="intro">${c.nq} questions de votre liste · ${c.npts} questions sur 40 le jour de
      l'examen<br>${riche(c.chapo)}</p>`;
  let liste = false;
  const fermer = () => { if (liste){ html += "</ul>"; liste = false; } };
  c.blocs.forEach(b => {
    if (b.k !== "b") fermer();
    if (b.k === "h1") html += `<h3>${riche(b.t)}</h3>`;
    else if (b.k === "h2") html += `<h4>${riche(b.t)}</h4>`;
    else if (b.k === "p") html += `<p>${riche(b.t)}</p>`;
    else if (b.k === "b"){ if(!liste){ html += "<ul>"; liste = true; }
      html += `<li>${riche(b.t)}</li>`; }
    else if (b.k === "tab"){
      html += `<div class="tblwrap"><table><thead><tr>` +
        b.entetes.map(e => `<th>${riche(e)}</th>`).join("") + `</tr></thead><tbody>` +
        b.lignes.map(r => `<tr>` + r.map(x => `<td>${riche(x)}</td>`).join("") + `</tr>`).join("") +
        `</tbody></table></div>`;
    } else if (b.k === "encadre"){
      html += `<div class="cadre"><p>${riche(b.titre)}</p><ul>` +
        b.lignes.map(x => `<li>${riche(x)}</li>`).join("") + `</ul></div>`;
    }
  });
  fermer();
  main.innerHTML = html + "</div>";
  etat.lus[num] = 1; sauver();
  commandes.hidden = false; rangee.innerHTML = "";
  rangee.appendChild(bouton("S'entraîner sur ce thème", "btn", () => {
    etat.filtreT = c.theme; etat.filtreM = "NAT"; sauver();
    lancer(melanger(banque().filter(q => q.m === "NAT" && q.t === c.theme)), false);
  }));
  rangee.appendChild(bouton(num < 5 ? "Chapitre suivant" : "Sommaire", "btn creux mini",
    () => num < 5 ? lireChapitre(num + 1) : sommaire()));
}

/* ----------------------------------------------------------- entraînement */
function lancer(liste, chrono){
  if (!liste.length){ alert("Aucune question ne correspond à cette sélection."); return; }
  s = {liste, n:0, su:0, rate:0, chrono, theme:null,
       fin: chrono ? Date.now() + 45*60*1000 : null};
  const th = [...new Set(liste.map(q => q.t))];
  if (th.length === 1) s.theme = th[0];
  $("btnQuitter").hidden = false;
  $("btnQuitter").onclick = () => { if (s.n < s.liste.length &&
    !confirm("Arrêter la session en cours ?")) return; clearInterval(s.tic); accueil(); };
  $("sousTitre").textContent = chrono ? "session chronométrée" : "entraînement";
  if (chrono){ $("chrono").hidden = false; tictac(); s.tic = setInterval(tictac, 1000); }
  else $("chrono").hidden = true;
  poser();
}
function tictac(){
  const r = Math.max(0, s.fin - Date.now());
  $("chrono").textContent = String(Math.floor(r/60000)).padStart(2,"0") + ":" +
    String(Math.floor(r/1000)%60).padStart(2,"0");
  $("chrono").classList.toggle("urgent", r < 5*60*1000);
  if (r === 0){ clearInterval(s.tic); bilan(true); }
}
function poser(){
  if (s.n >= s.liste.length){ if(s.tic) clearInterval(s.tic); return bilan(false); }
  const q = s.liste[s.n];
  $("compteur").textContent = (s.n+1) + " / " + s.liste.length;
  $("jauge").style.width = (100*s.n/s.liste.length) + "%";
  commandes.hidden = false; main.classList.add("centre");
  main.innerHTML = `<div class="scene">
    <div class="theme"><span class="pastille">${q.m}</span>${q.t}</div>
    <p class="question">${echap(q.q)}</p><div id="zoneRep"></div></div>`;
  main.scrollTop = 0; rangee.innerHTML = "";
  const v = bouton("Voir la réponse", "btn", () => reveler(q));
  rangee.appendChild(v); v.focus({preventScroll:true});
}
function reveler(q){
  $("zoneRep").innerHTML = `<div class="reponse"><b>Réponse attendue</b>${echap(q.a)}</div>`;
  rangee.innerHTML = "";
  rangee.appendChild(bouton("Je savais", "btn su", () => noter(q, true)));
  rangee.appendChild(bouton("À revoir", "btn revoir", () => noter(q, false)));
}
function noter(q, su){
  etat.vus[q.i] = 1;
  if (su){ s.su++; delete etat.arevoir[q.i]; } else { s.rate++; etat.arevoir[q.i] = 1; }
  sauver(); s.n++; poser();
}
function bilan(tempsEcoule){
  const faites = s.su + s.rate, pct = faites ? Math.round(100*s.su/faites) : 0;
  const theme = s.theme, chrono = s.chrono, rate = s.rate, su = s.su;
  const ratees = s.liste.filter(q => etat.arevoir[q.i]);
  chrome(chrono ? "session chronométrée" : "entraînement");
  $("jauge").style.width = "100%";
  const chap = theme ? DONNEES.cours.find(c => c.theme === theme) : null;
  main.innerHTML = `<div class="ecran">
    <p class="score">${pct}<em> %</em></p>
    <h1 style="margin-top:14px">${su} sur ${faites}</h1>
    <p class="chapo">${tempsEcoule ? "Temps écoulé. " : ""}${
      chrono ? (pct >= 80
        ? "Au-dessus du seuil de 80 %. Refaites-en d'autres : le jour J, il faut y arriver de façon régulière."
        : "En dessous du seuil de 80 %. Reprenez le cours du thème le plus fragile avant de recommencer.")
      : (rate ? "Les questions ratées sont en attente : reprenez-les pendant qu'elles sont fraîches."
              : "Aucune erreur sur cette série.")}</p>
    <div class="rangee" style="margin-bottom:10px">
      <button class="btn" id="encore" ${rate?"":"disabled style=opacity:.4"}>
        Reprendre les ${rate} ratées</button></div>
    ${chap ? `<div class="rangee" style="margin-bottom:10px">
      <button class="btn creux" id="relire">Relire le cours du thème ${chap.num}</button></div>` : ""}
    <div class="rangee"><button class="btn creux" id="retour">Revenir au menu</button></div>
  </div>`;
  $("encore").onclick = () => lancer(melanger(ratees), false);
  if (chap) $("relire").onclick = () => lireChapitre(chap.num);
  $("retour").onclick = accueil;
}

/* ----------------------------------------------------------------- import */
function ecranImport(){
  chrome("import");
  main.innerHTML = `<div class="ecran">
    <h1>Importer une autre liste</h1>
    <p class="chapo">L'application contient déjà les trois listes officielles. Cet écran sert
      si le ministère publie une révision de la liste.</p>
    <p style="font-size:15px;line-height:1.6">Récupérez le fichier JSON sur
      <a href="https://www.data.gouv.fr/datasets/examen-civique-naturalisation-questions-de-connaissances-officielles-et-propositions-de-reponses" target="_blank" rel="noopener">data.gouv.fr</a>,
      ouvrez-le, copiez tout son contenu et collez-le ci-dessous.</p>
    <textarea id="zone" placeholder="Collez ici le contenu du fichier JSON"></textarea>
    <div id="retourImport"></div>
    <div class="rangee" style="margin-top:14px">
      <button class="btn" id="charger">Charger</button>
      <button class="btn creux mini" id="annuler">Retour</button></div>
    <p class="note">En cas de rediffusion publique, la licence Etalab impose de mentionner
      « Réponses suggérées par <a href="https://leqcmcivique.fr" target="_blank" rel="noopener">leqcmcivique.fr</a> ».</p>
  </div>`;
  $("annuler").onclick = accueil;
  $("charger").onclick = () => {
    const brut = $("zone").value.trim(), cible = $("retourImport");
    if (!brut){ cible.innerHTML = `<div class="msg ko">Le champ est vide.</div>`; return; }
    try{
      const lot = normaliser(JSON.parse(brut));
      if (!lot.length) throw new Error("aucune question reconnue");
      etat.importe = lot; etat.filtreM = "IMP"; sauver();
      cible.innerHTML = `<div class="msg ok">${lot.length} questions chargées.</div>`;
      setTimeout(accueil, 900);
    }catch(e){
      cible.innerHTML = `<div class="msg ko">Fichier non reconnu (${echap(e.message)}).
        Vérifiez que vous avez collé le fichier en entier.</div>`;
    }
  };
}
function normaliser(brut){
  const sortie = []; let n = 900000;
  const pousser = (o, theme) => {
    const q = o.question || o.q || o.intitule || o.libelle; if (!q) return;
    let a = o.suggested_answers || o.reponses || o.answers || o.a || o.reponse;
    if (Array.isArray(a)) a = a.join(" · ");
    sortie.push({i: ++n, t: rapprocher(theme || o.theme || o.thematique || ""), m: "IMP",
      q: String(q).trim(), a: a ? String(a).trim() : "Réponse non fournie par le fichier."});
  };
  const parcourir = (v, theme) => {
    if (Array.isArray(v)) v.forEach(x => (x && typeof x === "object") ? pousser(x, theme) : null);
    else if (v && typeof v === "object")
      Object.entries(v).forEach(([k, val]) => parcourir(val, isNaN(k) ? k : theme));
  };
  parcourir(brut, null); return sortie;
}
function rapprocher(txt){
  const n = String(txt).toLowerCase();
  const c = [["valeur",0],["principe",0],["laïc",0],["institution",1],["politique",1],
             ["droit",2],["devoir",2],["histoire",3],["géographie",3],["geographie",3],
             ["culture",3],["vivre",4],["société",4],["societe",4]];
  for (const [k,i] of c) if (n.includes(k)) return DONNEES.themes[i];
  return DONNEES.themes[0];
}
accueil();
</script>
